<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rings — a tree since 1800</title>
<script src="../vendor/p5.min.js"></script>
<script src="../lib/relief.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#efece4;color:#2f2a24;overflow:hidden;font-family:'Lora',serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;cursor:crosshair}
#year{position:fixed;pointer-events:none;font-style:italic;font-size:14px;color:#3b3128;white-space:nowrap;
  background:rgba(239,236,228,0.88);padding:2px 7px;border-radius:2px;transform:translate(14px,-26px);opacity:0;transition:opacity .2s}
.back{position:fixed;left:20px;top:18px;font-style:italic;font-size:13px;color:#6a645b;text-decoration:none}
.back:hover{color:#2f2a24}
</style>
</head>
<body>
<a class="back" href="../">Protolab</a>
<div id="stage"></div>
<div id="year" aria-live="polite"></div>
<script>
// ═══════════════════════════════════════════════════════════════
// RINGS — a cross-section of a tree that started growing in 1800.
//
// A. E. Douglass, an astronomer looking for sunspots, found the climate
// written in pine: a wet year makes a wide ring, a dry or cold one a
// narrow ring, and the same pattern of narrow years matches across trees,
// so wood can be dated to the year. Big volcanic eruptions leave their mark
// as a run of cold, thin rings everywhere at once.
//
// This slice was grown year by year from a climate that wanders on its own,
// with the known cold years pressed in:
// 1816 (Tambora — the year without a summer), 1883 (Krakatoa), and the
// Dust Bowl. The end grain has weathered: the soft earlywood has worn back,
// the dense latewood stands up, so the rings are a relief under the lamp.
// Hover a ring to read its year.
// ═══════════════════════════════════════════════════════════════

const START = 1800, END = 2026;
const EVENTS = {1601: [0.32, 'Huaynaputina'], 1602: [0.6, ''], 1816: [0.28, 'the year without a summer'], 1817: [0.6, ''], 1883: [0.5, 'Krakatoa'], 1884: [0.75, ''],
  1934: [0.5, 'the Dust Bowl'], 1935: [0.55, 'the Dust Bowl'], 1936: [0.5, 'the Dust Bowl']};
let DW, DH, SS, PW, PH, F, art, artCtx, lo = null, ready = false, need = false, moving = 0;
let cov, hgt, nrm, colorMap, radii, C, lamp = {x: 0, y: 0}, lampT = {x: 0, y: 0};

function grow(){
  noiseSeed(1800);
  const widths = [];
  for(let y=START;y<=END;y++){
    const age = y - START;
    let w = 1 + (noise(y*0.11)*2 - 1)*0.45 + (noise(y*0.9 + 40) - 0.5)*0.35;
    w *= age < 30 ? 2.2 - age*0.04 : 1;                       // a young tree grows fast
    if(EVENTS[y]) w *= EVENTS[y][0];
    widths.push(Math.max(0.15, w));
  }
  const total = widths.reduce((a, b) => a + b, 0), R = Math.min(DW, DH)*0.45;
  radii = []; let acc = 0; widths.forEach(w => { acc += w/total*R; radii.push(acc); });
  C = {x: DW/2, y: DH/2 - 10, R};
}
// the slice is never quite round: each ring wobbles the same way the one inside it did
const wobble = (a, r) => 1 + 0.035*Math.sin(a*2 + 0.6) + 0.025*Math.sin(a*3 + r*0.01) + 0.015*(noise(Math.cos(a) + 3, Math.sin(a) + 3, r*0.004) - 0.5);
function ringAt(px, py){
  const dx = px - C.x, dy = py - C.y, a = Math.atan2(dy, dx), r = Math.hypot(dx, dy)/wobble(a, Math.hypot(dx, dy));
  let lo2 = 0, hi = radii.length - 1;
  if(r > radii[hi]) return {i: -1, r};
  while(lo2 < hi){ const m = (lo2 + hi) >> 1; if(radii[m] < r) lo2 = m + 1; else hi = m; }
  const inner = lo2 ? radii[lo2 - 1] : 0, f = (r - inner)/(radii[lo2] - inner);
  return {i: lo2, f, r, a};
}

function build(){
  grow();
  const n2 = PW*PH; cov = new Float32Array(n2); hgt = new Float32Array(n2); colorMap = new Uint8ClampedArray(n2*3);
  const surf = new Float32Array(n2), cracks = [0.4, 2.2, 3.9, 5.1];
  for(let y=0;y<PH;y++) for(let x=0;x<PW;x++){
    const i = y*PW + x, X = x/SS, Y = y/SS, k = ringAt(X, Y), o = i*3;
    const dist = Math.hypot(X - C.x, Y - C.y), barkR = C.R*1.08*wobble(Math.atan2(Y - C.y, X - C.x), dist);
    if(dist > barkR){ continue; }
    cov[i] = Math.min(1, (barkR - dist)*SS*0.8);
    if(k.i < 0){
      // bark: dark, deeply furrowed
      const fur = noise(Math.atan2(Y - C.y, X - C.x)*30, dist*0.05);
      colorMap[o] = 74*fur + 40; colorMap[o+1] = 54*fur + 30; colorMap[o+2] = 40*fur + 22;
      surf[i] = 0.55 + fur*0.25; hgt[i] = 0.6 + fur*0.4; continue;
    }
    // a smooth ramp into the latewood, so even thin rings stay above a pixel
    const late = Math.max(0, Math.min(1, (k.f - 0.45)/0.35))*Math.min(1, (1 - k.f)/0.12 + 0.4);
    const t = k.i/radii.length;                                 // heartwood darker, sapwood paler
    const heart = t < 0.82 ? 1 : Math.max(0, 1 - (t - 0.82)/0.06);
    let r = 222 - heart*26, g = 190 - heart*30, b = 144 - heart*34;
    r -= late*72; g -= late*66; b -= late*52;
    // pores and the odd ray running outward
    let h = 0.5 + late*0.06 + (noise(X*0.8, Y*0.8) - 0.5)*0.01;
    // checks: the slice split as it dried, from the bark inward
    cracks.forEach(ca => { const d = Math.abs(Math.atan2(Math.sin(k.a - ca), Math.cos(k.a - ca))); const reach = t > 0.35; if(reach && d*dist < 1.6*(t - 0.3)*3){ r *= 0.45; g *= 0.42; b *= 0.4; h -= 0.08; } });
    colorMap[o] = r; colorMap[o+1] = g; colorMap[o+2] = b; surf[i] = h; hgt[i] = 0.7 + 0.3*late;
  }
  nrm = F.normals(cov, F.blur(surf, Math.max(1, Math.round(SS*0.8)), 2), 26*SS);
  makeLo(); need = true;
}

const LO = 3;
function makeLo(){
  const w = Math.floor(PW/LO), h = Math.floor(PH/LO), n = w*h;
  lo = {F: Relief.field(w, h), cov: new Float32Array(n), hgt: new Float32Array(n),
        nX: new Float32Array(n), nY: new Float32Array(n), nZ: new Float32Array(n), colorMap: new Uint8ClampedArray(n*3)};
  lo.cv = Relief.makeCanvas(w, h); lo.ctx = lo.cv.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i = y*w + x, a = (y*LO)*PW + x*LO;
    lo.cov[i] = cov[a]; lo.hgt[i] = hgt[a]; lo.nX[i] = nrm.nX[a]; lo.nY[i] = nrm.nY[a]; lo.nZ[i] = nrm.nZ[a];
    lo.colorMap[i*3] = colorMap[a*3]; lo.colorMap[i*3+1] = colorMap[a*3+1]; lo.colorMap[i*3+2] = colorMap[a*3+2];
  }
}
function shade(preview){
  const k = preview ? 1/LO : 1;
  (preview ? lo.F : F).shade(preview ? lo.ctx : artCtx, {
    cov: preview ? lo.cov : cov, hgt: preview ? lo.hgt : hgt, hMax: 1,
    nX: preview ? lo.nX : nrm.nX, nY: preview ? lo.nY : nrm.nY, nZ: preview ? lo.nZ : nrm.nZ,
    colorMap: preview ? lo.colorMap : colorMap,
    light: {x: lamp.x*SS*k, y: lamp.y*SS*k, h: 220*SS*k, radius: 1500*SS*k, color: '#fff3df'},
    ambient: 0.42, aoLo: 0.5, exposure: 1.15, matte: true, wrap: 0.35, sheen: 0.05, scatter: 0.04});
}

function setup(){
  pixelDensity(1);
  DW = document.documentElement.clientWidth; DH = innerHeight;
  SS = Math.max(1, Math.min(Math.min(devicePixelRatio || 1, 2), Math.sqrt(3.2e6/(DW*DH))));
  PW = Math.round(DW*SS); PH = Math.round(DH*SS);
  createCanvas(PW, PH).parent('stage'); const c = document.querySelector('#stage canvas'); c.style.width = DW + 'px'; c.style.height = DH + 'px';
  F = Relief.field(PW, PH); art = Relief.makeCanvas(PW, PH); artCtx = art.getContext('2d');
  lamp = {x: DW*0.3, y: DH*0.15}; lampT = {x: DW*0.35, y: DH*0.2};
  if(DW > 2){ build(); ready = true; }
}
function windowResized(){
  DW = document.documentElement.clientWidth; DH = innerHeight;
  PW = Math.round(DW*SS); PH = Math.round(DH*SS); resizeCanvas(PW, PH);
  const c = document.querySelector('#stage canvas'); c.style.width = DW + 'px'; c.style.height = DH + 'px';
  F = Relief.field(PW, PH); art = Relief.makeCanvas(PW, PH); artCtx = art.getContext('2d');
  if(DW > 2){ build(); ready = true; }
}
const yearEl = document.getElementById('year');
function mouseMoved(){
  lampT = {x: mouseX/SS, y: mouseY/SS};
  if(!ready) return;
  const k = ringAt(mouseX/SS, mouseY/SS);
  if(k.i < 0){ yearEl.style.opacity = 0; return; }
  const yr = START + k.i, ev = EVENTS[yr] && EVENTS[yr][1];
  yearEl.textContent = yr + (ev ? ' · ' + ev : '');
  yearEl.style.left = mouseX/SS + 'px'; yearEl.style.top = mouseY/SS + 'px'; yearEl.style.opacity = 1;
}
function draw(){
  if(!ready) return;
  const dx = lampT.x - lamp.x, dy = lampT.y - lamp.y;
  if(Math.abs(dx) + Math.abs(dy) > 0.8){ lamp.x += dx*0.12; lamp.y += dy*0.12; moving = 5; need = true; }
  if(need){ if(moving > 0){ shade(true); moving--; } else { shade(false); need = false; } }
  const g = drawingContext; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, PW, PH);
  g.save(); g.shadowColor = 'rgba(40,30,20,0.3)'; g.shadowBlur = 22*SS; g.shadowOffsetY = 10*SS;
  g.imageSmoothingQuality = 'high';
  if(moving > 0 && lo) g.drawImage(lo.cv, 0, 0, PW, PH); else g.drawImage(art, 0, 0);
  g.restore();
}
</script>
</body>
</html>
