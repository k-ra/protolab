<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kintsugi — mended in gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f2a24;--soft:#5d574e}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#8fa598;color:var(--ink);overflow:hidden;font-family:'Lora',serif}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair;touch-action:none}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:16px;font-style:italic;font-size:14px;color:var(--soft);white-space:nowrap}
.bar button{font:inherit;color:var(--soft);background:none;border:none;cursor:pointer}
.bar button:hover,.bar button:focus-visible{color:var(--ink)}
.back{position:fixed;left:20px;top:18px;font-style:italic;font-size:13px;color:var(--soft);text-decoration:none}
.back:hover{color:var(--ink)}
.dark{--ink:#f4efe6;--soft:#d6cfc4}
#nogl{display:none;position:fixed;inset:0;place-items:center;font-style:italic;color:var(--soft)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<a class="back" href="../">Protolab</a>
<div class="bar"><span id="count">strike the glaze</span><button id="fresh">another glaze</button></div>
<div id="nogl">This study needs WebGL2.</div>
<script>
// ═══════════════════════════════════════════════════════════════
// KINTSUGI — a glaze that keeps its breaks.
//
// The Japanese repair of broken ceramics with urushi lacquer dusted in gold,
// from the fifteenth century on: the break is not hidden but made the most
// precious line on the pot.
//
// The whole window is one glazed surface, drawn on the GPU at full device
// resolution. Strike it and cracks run from the blow in a fraction of a
// second: nearly straight, kinking at small scale, forking, stopping at the
// edge or at an older break. Then the lacquer seeps out of the blow along
// every crack, slowing as it goes, swelling where the brush would have
// paused, pooling at forks, red urushi showing at its thin edges and gold
// dust over its back. Each mend is a raised bead, lit by a lamp that follows
// the cursor and by a studio softbox in its reflection.
//
// The cracks are drawn once per strike into a float field (signed distance
// to the gold's edge, distance along the crack from the blow, half-width,
// time of the blow); everything that moves is worked out per pixel from
// that field and the clock.
// ═══════════════════════════════════════════════════════════════

const GLAZES = [
  {name: 'celadon', thin: '#a9bfae', thick: '#5f8a7a', flash: '#c7c9a4', flashAmt: 0.25, speck: '#4a3a2a', craze: 0.55, streak: 0,   pin: 0.2, rough: 0.10, ui: 'light'},
  {name: 'tenmoku', thin: '#4a2614', thick: '#0e0907', flash: '#9a6234', flashAmt: 0.15,  speck: '#2a1a12', craze: 0,    streak: 0.9, pin: 0.1, rough: 0.07, ui: 'dark'},
  {name: 'shino',   thin: '#efe5d6', thick: '#dcc8b6', flash: '#d08a5e', flashAmt: 0.75, speck: '#6a4a36', craze: 0.3,  streak: 0,   pin: 1.0, rough: 0.22, ui: 'light'},
  {name: 'ruri',    thin: '#4a64a0', thick: '#101c46', flash: '#7f96c2', flashAmt: 0.15, speck: '#101830', craze: 0.18, streak: 0, pin: 0.15, rough: 0.08, ui: 'dark'}
];

const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', {antialias: false, alpha: false, premultipliedAlpha: false});
if(!gl || !gl.getExtension('EXT_color_buffer_float')){
  document.getElementById('nogl').style.display = 'grid';
  throw new Error('WebGL2 with float render targets is needed');
}

// ── shaders ───────────────────────────────────────────────────
const NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz)*p3.zy); }
float hash11(float x){ x = fract(x*.1031); x *= x + 33.33; x *= x + x; return fract(x); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3. - 2.*f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y); }
float vnoise1(float x){ float i = floor(x), f = fract(x); f = f*f*(3. - 2.*f); return mix(hash11(i), hash11(i + 1.), f); }
float fbm(vec2 p){ float a = .5, s = 0.; for(int i = 0; i < 5; i++){ s += a*vnoise(p); p = p*2.03 + vec2(17.1, 9.2); a *= .5; } return s/.97; }
`;

const VS_FULL = `#version 300 es
in vec2 aP; void main(){ gl_Position = vec4(aP, 0, 1); }`;

// the glaze itself: colour, crazing, speckle, and the gentle undulation of a poured coat
const FS_SURF = `#version 300 es
precision highp float;
uniform vec2 uOff; uniform float uDpr;
uniform vec3 uThin, uThick, uFlash, uSpeck;
uniform float uCraze, uStreak, uPin, uRough, uFlashAmt;
layout(location = 0) out vec4 oA;
layout(location = 1) out vec4 oB;
${NOISE}
float vorEdge(vec2 x){
  vec2 n = floor(x), f = fract(x), mg = vec2(0), mr = vec2(0); float md = 8.;
  for(int j = -1; j <= 1; j++) for(int i = -1; i <= 1; i++){
    vec2 g = vec2(i, j), r = g + hash22(n + g) - f; float d = dot(r, r);
    if(d < md){ md = d; mr = r; mg = g; }
  }
  md = 8.;
  for(int j = -2; j <= 2; j++) for(int i = -2; i <= 2; i++){
    vec2 g = mg + vec2(i, j), r = g + hash22(n + g) - f;
    if(dot(mr - r, mr - r) > 1e-5) md = min(md, dot(.5*(mr + r), normalize(r - mr)));
  }
  return md;
}
void main(){
  vec2 q = gl_FragCoord.xy/uDpr + uOff;
  vec2 wq = q + 22.*vec2(fbm(q/160.), fbm(q/160. + 3.1)) ;
  // where the glaze ran thick and where it broke thin over the body
  float t = smoothstep(.18, .86, fbm(q/520.)*.8 + fbm(q/140. + 11.)*.2);
  vec3 alb = mix(uThin, uThick, t);
  alb = mix(alb, uFlash, uFlashAmt*smoothstep(.55, 0., t)*smoothstep(.35, .72, fbm(q/230. + 5.)));
  // hare's fur: iron streaks drawn down the slope as the glaze ran
  float st = vnoise(vec2(wq.x/1.1, wq.y/70.))*.55 + vnoise(vec2(wq.x/3.2, wq.y/150.) + 4.)*.45;
  alb = mix(alb, uFlash, smoothstep(.62, .95, st)*uStreak*.55*smoothstep(.2, .9, t));
  // crazing, a net where the glaze shrank more than the body as it cooled
  vec2 cq = q + 34.*vec2(fbm(q/95. + 7.), fbm(q/95. + 1.7)) + 4.*vec2(vnoise(q/9.), vnoise(q/9. + 3.));
  float e1 = vorEdge(cq/68.)*68., e2 = vorEdge(cq/26. + 9.)*26.;
  float s1 = smoothstep(.25, .75, vnoise(cq/40. + 2.)), s2 = smoothstep(.45, .8, vnoise(q/55.))*smoothstep(.3, .7, vnoise(cq/16.));
  float cr = (1. - smoothstep(.05, .55 + .35*s1, e1))*(.35 + .65*s1) + .6*(1. - smoothstep(.03, .4, e2))*s2;
  cr = clamp(cr, 0., 1.)*uCraze;
  alb = mix(alb, alb*vec3(.52, .46, .40), cr*.75);
  // iron specks from the body, and pinholes where gas broke the surface
  vec2 rq = mat2(.8, -.6, .6, .8)*q;
  float spot = smoothstep(.9, .97, vnoise(rq/1.9 + 31.))*smoothstep(.6, .8, vnoise(q/60.));
  alb = mix(alb, uSpeck, spot*.8);
  float ph = smoothstep(.94, .985, vnoise(mat2(.6, .8, -.8, .6)*q/1.5 + 71.))*uPin;
  alb *= 1. - ph*.45;
  float h = (fbm(q/760.)*5. + fbm(q/260. + 6.)*.7 + fbm(q/55. + 2.)*.1 + (vnoise(q/14.)-.5)*.04 - cr*.25 - ph*.5)*uDpr;
  oA = vec4(alb, h);
  oB = vec4(cr, t, clamp(uRough + .05*(vnoise(q/45.) - .5), .02, 1.), 1.);
}`;

// one instance per crack segment (or per pool, a segment of length 0)
const VS_FIELD = `#version 300 es
in vec2 aC; in vec4 aAB; in vec4 aSW; in float aT;
uniform vec2 uRes; uniform float uPad;
out vec2 vP; flat out vec4 vAB; flat out vec4 vSW; flat out float vT;
void main(){
  vec2 a = aAB.xy, b = aAB.zw, d = b - a; float L = length(d);
  vec2 t = L > 1e-4 ? d/L : vec2(1, 0), n = vec2(-t.y, t.x);
  float R = max(aSW.z, aSW.w) + uPad;
  vec2 p = mix(a, b, aC.x*.5 + .5) + t*aC.x*R + n*aC.y*R;
  vP = p; vAB = aAB; vSW = aSW; vT = aT;
  gl_Position = vec4(p/uRes*2. - 1., 0, 1);
}`;
const FS_FIELD = `#version 300 es
precision highp float;
in vec2 vP; flat in vec4 vAB; flat in vec4 vSW; flat in float vT;
uniform float uPad;
out vec4 o;
void main(){
  vec2 a = vAB.xy, b = vAB.zw, pa = vP - a, ba = b - a;
  float h = clamp(dot(pa, ba)/max(dot(ba, ba), 1e-6), 0., 1.);
  float d = length(pa - ba*h), w = mix(vSW.z, vSW.w, h), sd = d - w;
  if(sd > uPad) discard;
  gl_FragDepth = clamp((sd + 96.)/512., 0., 1.);   // the nearest edge wins
  o = vec4(sd, mix(vSW.x, vSW.y, h), w, vT);
}`;

// the picture: glaze, open cracks, urushi and gold, lit
const FS_SHADE = `#version 300 es
precision highp float;
uniform sampler2D uSurfA, uSurfB, uGold, uHair;
uniform vec2 uRes; uniform float uDpr, uTime, uLightPow, uLightR, uExpo, uAmb;
uniform vec3 uLight;
out vec4 o;
${NOISE}
const float PI = 3.14159265;

float flowT(float s){
  // the lacquer leaves the blow quickly and slows as it goes
  return 1.1 + 2.8*pow(max(s, 0.)/(200.*uDpr), 1.3) + .7*(vnoise1(s/(36.*uDpr)) - .5);
}

struct S { float h, gold, lac, hair, d, gw, lw, fresh; };
S at(ivec2 c){
  c = clamp(c, ivec2(0), ivec2(uRes) - 1);
  S r;
  vec4 gf = texelFetch(uGold, c, 0), hf = texelFetch(uHair, c, 0);
  vec2 p = vec2(c);
  float base = texelFetch(uSurfA, c, 0).a;
  float ca = uTime - (hf.a + hf.y/(1700.*uDpr));
  r.hair = ca > 0. ? (1. - smoothstep(.2*uDpr, 1.05*uDpr, hf.x))*smoothstep(0., .06, ca) : 0.;
  float w = gf.z, d = gf.x + w;
  float age = uTime - (gf.a + flowT(gf.y));
  float spread = .5 + .2*w/uDpr;
  float fill = clamp(age/spread, 0., 1.);
  fill = 1. - (1. - fill)*(1. - fill);
  // a hand-laid edge: never quite the same width twice
  float wob = 1. + .22*(vnoise(p/(16.*uDpr)) - .5) + .2*(vnoise(p/(5.5*uDpr)) - .5) + .06*(vnoise(p/(1.8*uDpr) + 7.3) - .5);
  float gw = w*fill*wob;
  float lw = (w*1.02 + 1.3*uDpr*smoothstep(.45, .85, vnoise(p/(9.*uDpr) + 2.)))*fill;
  float aa = .65;
  r.gold = gw > .05 ? 1. - smoothstep(gw - aa, gw + aa, d) : 0.;
  r.lac = lw > .05 ? 1. - smoothstep(lw - aa, lw + aa, d) : 0.;
  float prof = gw > .05 ? pow(max(0., 1. - d*d/(gw*gw)), .35) : 0.;   // lacquer settles flat, rounding only at its edge
  r.h = base + prof*min(gw*.45, 2.2*uDpr) + r.lac*.3*uDpr - r.hair*(1. - r.lac)*.9*uDpr;
  r.d = d; r.gw = gw; r.lw = lw;
  r.fresh = age > 0. ? exp(-age/3.5) : 0.;
  return r;
}

float softbox(vec3 r, vec3 d, vec2 hs, float k){
  float cd = dot(r, d); if(cd <= 0.) return 0.;
  vec3 t = normalize(cross(vec3(0, 0, 1), d)), b = cross(d, t);
  vec2 uv = vec2(dot(r, t), dot(r, b))/cd;
  vec2 q = smoothstep(hs + k, hs - k, abs(uv));
  return q.x*q.y*(hs.x*hs.y)/((hs.x + k)*(hs.y + k));
}
vec3 env(vec3 r, float rough){
  float k = .015 + rough*.6;
  vec3 c = mix(vec3(.06, .05, .04), vec3(.7, .64, .55), smoothstep(-.2, .98, r.z));
  c *= .8 + .2*smoothstep(-.6, .6, r.x - r.y);
  c += softbox(r, normalize(vec3(-.16, .14, .977)), vec2(.14, .09), k)*vec3(9., 8.7, 8.2);
  c += softbox(r, normalize(vec3(.3, -.1, .95)), vec2(.025, .26), k)*vec3(3., 3.1, 3.3);
  return c;
}
float D_GGX(float NoH, float a){ float a2 = a*a, d = NoH*NoH*(a2 - 1.) + 1.; return a2/(PI*d*d); }
float Vis(float NoV, float NoL, float a){ float a2 = a*a;
  float gv = NoL*sqrt(NoV*NoV*(1. - a2) + a2), gl = NoV*sqrt(NoL*NoL*(1. - a2) + a2); return .5/max(gv + gl, 1e-5); }

vec3 lampSpec(vec3 f0, float rough, vec3 N, vec3 V, vec3 L, vec3 lc, float lr){
  vec3 H = normalize(V + L);
  float NoV = max(dot(N, V), 1e-3), NoL = max(dot(N, L), 0.), NoH = max(dot(N, H), 0.), VoH = max(dot(V, H), 0.);
  float a = max(rough*rough, .002), a2 = clamp(a + lr*.5, 0., 1.);   // a lamp with a size, not a point
  vec3 F = f0 + (1. - f0)*pow(1. - VoH, 5.);
  return lc*F*D_GGX(NoH, a2)*Vis(NoV, NoL, a2)*(a/a2)*NoL;
}
vec3 dielectric(vec3 alb, float f0, float rough, vec3 N, vec3 V, vec3 L, vec3 lc, float lr){
  float NoV = max(dot(N, V), 1e-3), NoL = dot(N, L);
  float Fv = f0 + (1. - f0)*pow(1. - NoV, 5.);
  vec3 diff = alb*(lc*max(NoL*.85 + .15, 0.) + env(N, 1.)*uAmb);
  return diff*(1. - Fv) + lampSpec(vec3(f0), rough, N, V, L, lc, lr) + env(reflect(-V, N), rough)*Fv;
}
vec3 metal(vec3 f0, float rough, vec3 N, vec3 V, vec3 L, vec3 lc, float lr){
  float NoV = max(dot(N, V), 1e-3);
  vec3 Fv = f0 + (1. - f0)*pow(1. - NoV, 5.);
  return lampSpec(f0, rough, N, V, L, lc, lr) + env(reflect(-V, N), rough)*Fv;
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03))/(x*(2.43*x + .59) + .14), 0., 1.); }

void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec2 p = vec2(c);
  S m = at(c), l = at(c + ivec2(-1, 0)), rt = at(c + ivec2(1, 0)), dn = at(c + ivec2(0, -1)), up = at(c + ivec2(0, 1));
  vec3 N = normalize(vec3((l.h - rt.h)*.5, (dn.h - up.h)*.5, 1.));
  // gold dust over lacquer is never mirror-smooth
  vec2 gq = p/(1.25*uDpr);
  N = normalize(N + vec3(vnoise(gq) - .5, vnoise(gq + 5.2) - .5, 0.)*.22*m.gold);

  vec4 sa = texelFetch(uSurfA, c, 0), sb = texelFetch(uSurfB, c, 0);
  vec3 alb = sa.rgb;
  alb *= mix(1., .05, m.hair*(1. - m.lac));
  if(m.lw > .05) alb *= mix(.7, 1., smoothstep(0., 2.6*uDpr, m.d - m.lw));   // the bead shades the glaze beside it

  vec3 P = vec3(p + .5, m.h);
  vec3 cam = vec3(uRes*.5, max(uRes.x, uRes.y)*1.35);
  vec3 V = normalize(cam - P);
  vec3 Lv = uLight - P; float ld = length(Lv); vec3 L = Lv/ld;
  vec3 lc = vec3(1., .94, .86)*uLightPow*(uLight.z*uLight.z)/(ld*ld);
  float lr = uLightR/ld;

  vec3 col = dielectric(alb, .04, sb.b, N, V, L, lc, lr);
  vec3 lac = dielectric(vec3(.07, .022, .012), .05, .09, N, V, L, lc, lr);
  float gr = clamp(.26 + .26*(vnoise(p/(28.*uDpr)) - .5) + .12*(vnoise(p/(7.*uDpr) + 3.) - .5) - .08*m.fresh, .07, .6);
  vec3 au = metal(vec3(1., .66, .22), gr, N, V, L, lc, lr)*.85;
  au *= mix(1., .82, m.fresh);   // freshly laid, still a little sunk in wet lacquer
  col = mix(col, lac, m.lac);
  col = mix(col, au, m.gold);

  vec2 uv = gl_FragCoord.xy/uRes - .5;
  col *= 1. - .22*pow(length(uv*vec2(uRes.x/uRes.y, 1.))*1.05, 2.6);
  col = pow(aces(col*uExpo), vec3(1./2.2));
  col += (hash12(p + fract(uTime)*91.) - .5)/255.;
  o = vec4(col, 1);
}`;

function compile(vs, fs){
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
  return {p, u};
}
const P_SURF = compile(VS_FULL, FS_SURF), P_FIELD = compile(VS_FIELD, FS_FIELD), P_SHADE = compile(VS_FULL, FS_SHADE);

// a triangle covering the screen
const fullVAO = gl.createVertexArray();
gl.bindVertexArray(fullVAO);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
for(const P of [P_SURF, P_SHADE]){ const loc = gl.getAttribLocation(P.p, 'aP'); if(loc >= 0){ gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0); } }

// two instanced segment layers: gold (with pools) and the bare hairline
const corner = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, corner);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
function layer(){
  const vao = gl.createVertexArray(), buf = gl.createBuffer();
  gl.bindVertexArray(vao);
  const A = n => gl.getAttribLocation(P_FIELD.p, n);
  gl.bindBuffer(gl.ARRAY_BUFFER, corner);
  gl.enableVertexAttribArray(A('aC')); gl.vertexAttribPointer(A('aC'), 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const st = 36;
  [['aAB', 4, 0], ['aSW', 4, 16], ['aT', 1, 32]].forEach(([n, k, off]) => {
    gl.enableVertexAttribArray(A(n)); gl.vertexAttribPointer(A(n), k, gl.FLOAT, false, st, off); gl.vertexAttribDivisor(A(n), 1);
  });
  return {vao, buf, data: [], count: 0};
}
const GOLDL = layer(), HAIRL = layer();

function tex(w, h, ifmt, fmt, type){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fbo(texs, depth){
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  texs.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  if(depth){
    const rb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, W, H);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
  }
  gl.drawBuffers(texs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  return f;
}

// ── state ─────────────────────────────────────────────────────
let W, H, DPR, T = {}, F = {}, glaze = GLAZES[0], seed = 1480, strikes = 0, flowEnd = 0, need = true;
let grid = new Map(), nextId = 1;
const lamp = {x: 0, y: 0}, lampT = {x: 0, y: 0};
const t0 = performance.now();
const clock = () => (performance.now() - t0)/1000;

function size(){
  const css = [innerWidth, innerHeight];
  DPR = Math.min(devicePixelRatio || 1, 2);
  if(css[0]*css[1]*DPR*DPR > 9.5e6) DPR = Math.sqrt(9.5e6/(css[0]*css[1]));
  W = Math.round(css[0]*DPR); H = Math.round(css[1]*DPR);
  cv.width = W; cv.height = H;
  for(const k in T) gl.deleteTexture(T[k]);
  for(const k in F) gl.deleteFramebuffer(F[k]);
  T.surfA = tex(W, H, gl.RGBA32F, gl.RGBA, gl.FLOAT);   // height needs the precision: half floats step the reflections
  T.surfB = tex(W, H, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
  T.gold = tex(W, H, gl.RGBA32F, gl.RGBA, gl.FLOAT);
  T.hair = tex(W, H, gl.RGBA32F, gl.RGBA, gl.FLOAT);
  F.surf = fbo([T.surfA, T.surfB]); F.gold = fbo([T.gold], true); F.hair = fbo([T.hair], true);
  lamp.x = lampT.x = W*0.34; lamp.y = lampT.y = H*0.7;
  reset();
}

const hex = h => [1, 3, 5].map(i => Math.pow(parseInt(h.substr(i, 2), 16)/255, 2.2));
function paintGlaze(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, F.surf);
  gl.viewport(0, 0, W, H);
  gl.useProgram(P_SURF.p);
  const u = P_SURF.u;
  gl.uniform2f(u.uOff, (seed*37.1) % 5000, (seed*91.7) % 5000);
  gl.uniform1f(u.uDpr, DPR);
  gl.uniform3fv(u.uThin, hex(glaze.thin)); gl.uniform3fv(u.uThick, hex(glaze.thick));
  gl.uniform3fv(u.uFlash, hex(glaze.flash)); gl.uniform3fv(u.uSpeck, hex(glaze.speck));
  gl.uniform1f(u.uFlashAmt, glaze.flashAmt); gl.uniform1f(u.uCraze, glaze.craze);
  gl.uniform1f(u.uStreak, glaze.streak); gl.uniform1f(u.uPin, glaze.pin); gl.uniform1f(u.uRough, glaze.rough);
  gl.bindVertexArray(fullVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  document.body.classList.toggle('dark', glaze.ui === 'dark');
  document.body.style.background = glaze.thick;
}

function paintFields(){
  gl.useProgram(P_FIELD.p);
  gl.uniform2f(P_FIELD.u.uRes, W, H);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
  for(const [L, f, pad] of [[GOLDL, F.gold, 10*DPR], [HAIRL, F.hair, 3*DPR]]){
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.viewport(0, 0, W, H);
    gl.clearBufferfv(gl.COLOR, 0, [1e5, 0, 0, 1e9]);
    gl.clearDepth(1); gl.clear(gl.DEPTH_BUFFER_BIT);
    if(L.count){
      gl.uniform1f(P_FIELD.u.uPad, pad);
      gl.bindVertexArray(L.vao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, L.count);
    }
  }
  gl.disable(gl.DEPTH_TEST);
}
function upload(L){
  gl.bindBuffer(gl.ARRAY_BUFFER, L.buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(L.data), gl.STATIC_DRAW);
  L.count = L.data.length/9;
}

function reset(){
  GOLDL.data = []; HAIRL.data = []; upload(GOLDL); upload(HAIRL);
  grid = new Map(); strikes = 0; flowEnd = 0;
  paintGlaze(); paintFields();
  document.getElementById('count').textContent = 'strike the glaze';
  need = true;
}

// ── breaking ──────────────────────────────────────────────────
function rngOf(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
const h1 = x => { const s = Math.sin(x*127.1)*43758.5453; return s - Math.floor(s); };
const n1 = x => { const i = Math.floor(x), f = x - i, u = f*f*(3 - 2*f); return h1(i)*(1 - u) + h1(i + 1)*u; };
const flowT = s => 1.1 + 2.8*Math.pow(Math.max(s, 0)/(200*DPR), 1.3);

const CELL = () => 8*DPR;
const key = (x, y) => Math.floor(x/CELL())*65536 + Math.floor(y/CELL());
function mark(x, y, id){ const k = key(x, y); let a = grid.get(k); if(!a) grid.set(k, a = []); a.push(x, y, id); }
function hit(x, y, ignore, r){
  const c = CELL(), cx = Math.floor(x/c), cy = Math.floor(y/c);
  let best = null, bd = r*r;
  for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){
    const a = grid.get((cx + i)*65536 + cy + j); if(!a) continue;
    for(let k=0;k<a.length;k+=3){
      if(ignore(a[k+2])) continue;
      const dx = a[k] - x, dy = a[k+1] - y, d = dx*dx + dy*dy;
      if(d < bd){ bd = d; best = [a[k], a[k+1]]; }
    }
  }
  return best;
}
function seg(ax, ay, bx, by, s0, s1, w0, w1, t){
  GOLDL.data.push(ax, ay, bx, by, s0, s1, w0, w1, t);
  HAIRL.data.push(ax, ay, bx, by, s0, s1, 0, 0, t);
}
const pool = (x, y, s, r, t) => GOLDL.data.push(x, y, x, y, s, s, r, r, t);

function run(x, y, a, s, depth, w, rng, t, budget, parent){
  const id = nextId++, step = 4*DPR, kids = new Map();
  const L = budget*(0.55 + rng()*0.6), phase = rng()*100;
  const bend = (rng() - 0.5)*0.012;
  let px = x, py = y, ps = s, pw = w*0.9, maxS = s;
  for(let i=0; i*step < L; i++){
    a += (rng() - 0.5)*0.11 + bend;
    const kink = (rng() - 0.5)*0.6;
    let nx = px + Math.cos(a + kink)*step, ny = py + Math.sin(a + kink)*step, ns = ps + step;
    const left = L - i*step;
    const nw = w*(0.45 + 1.1*Math.pow(n1(ns/(55*DPR) + phase), 1.4) + 0.25*n1(ns/(14*DPR) + phase*3))*Math.max(0.3, Math.min(1, left/(60*DPR)));
    const h = hit(nx, ny, k => k === id || (k === parent && i < 8) || (kids.has(k) && i - kids.get(k) < 8), step*0.8);
    if(h){ seg(px, py, h[0], h[1], ps, ns, pw, nw, t); if(rng() < 0.6) pool(h[0], h[1], ns, nw*(1.4 + rng()), t); maxS = ns; break; }
    const out = nx < -20 || ny < -20 || nx > W + 20 || ny > H + 20;
    seg(px, py, nx, ny, ps, ns, pw, nw, t);
    mark(nx, ny, id);
    maxS = ns;
    if(out) break;
    if(rng() < 0.006){
      // swelling quickly where the brush landed, thinning slowly as it was drawn on
      const len = (3 + rng()*6)*step, r = nw*(1.25 + rng()*0.7), side = (rng() - 0.5)*nw*0.5;
      const ca = Math.cos(a + kink*0.5), sa = Math.sin(a + kink*0.5), ox = -sa*side, oy = ca*side, m = len*0.3;
      GOLDL.data.push(nx, ny, nx + ca*m + ox, ny + sa*m + oy, ns, ns + m, nw*0.8, r, t);
      GOLDL.data.push(nx + ca*m + ox, ny + sa*m + oy, nx + ca*len, ny + sa*len, ns + m, ns + len, r, nw*0.7, t);
    }              // where the brush paused
    if(depth < 2 && i > 8 && rng() < (depth ? 0.0035 : 0.009)){
      const kid = nextId;
      const ks = run(nx, ny, a + (rng() < 0.5 ? 1 : -1)*(0.3 + rng()*0.55), ns, depth + 1, nw*0.85, rng, t, left*0.85, id);
      kids.set(kid, i); maxS = Math.max(maxS, ks);
      if(rng() < 0.5) pool(nx, ny, ns, nw*(1.5 + rng()*0.8), t);
    }
    px = nx; py = ny; ps = ns; pw = nw;
  }
  return maxS;
}

function strike(cx, cy){
  const rng = rngOf(seed*7919 + strikes*104729), t = clock();
  const base = 2.7*DPR*Math.min(1.35, Math.max(0.85, Math.min(W, H)/DPR/880));
  const diag = Math.hypot(W, H);
  // the blow itself: a small crater of lacquer, never a perfect circle
  pool(cx, cy, 0, base*(3.2 + rng()*1.2), t);
  for(let i=0, k=3 + Math.floor(rng()*3); i<k; i++){
    const a = rng()*Math.PI*2, r = base*(1.5 + rng()*2.2);
    pool(cx + Math.cos(a)*r, cy + Math.sin(a)*r, r*0.5, base*(1.4 + rng()*1.6), t);
  }
  const arms = 3 + Math.floor(rng()*3), a0 = rng()*Math.PI*2;
  let maxS = 0;
  for(let k=0;k<arms;k++){
    const a = a0 + k*Math.PI*2/arms + (rng() - 0.5)*0.9;
    maxS = Math.max(maxS, run(cx, cy, a, 0, 0, base*(0.8 + rng()*0.4), rng, t, diag*(0.45 + rng()*0.5), -1));
  }
  upload(GOLDL); upload(HAIRL); paintFields();
  flowEnd = Math.max(flowEnd, t + flowT(maxS) + 4);
  strikes++;
  document.getElementById('count').textContent = strikes === 1 ? 'mended once' : 'mended ' + strikes + ' times';
  need = true;
}

// ── drawing ───────────────────────────────────────────────────
function frame(){
  requestAnimationFrame(frame);
  const dx = lampT.x - lamp.x, dy = lampT.y - lamp.y;
  if(Math.abs(dx) + Math.abs(dy) > 0.3){ lamp.x += dx*0.14; lamp.y += dy*0.14; need = true; }
  const t = clock();
  if(!need && t > flowEnd) return;
  need = false;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(P_SHADE.p);
  const u = P_SHADE.u;
  [['uSurfA', T.surfA], ['uSurfB', T.surfB], ['uGold', T.gold], ['uHair', T.hair]].forEach(([n, tx], i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tx); gl.uniform1i(u[n], i);
  });
  const m = Math.min(W, H);
  gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uDpr, DPR); gl.uniform1f(u.uTime, t);
  gl.uniform3f(u.uLight, lamp.x, lamp.y, m*0.62);
  gl.uniform1f(u.uLightPow, 1.9); gl.uniform1f(u.uLightR, m*0.06);
  gl.uniform1f(u.uExpo, 1.0); gl.uniform1f(u.uAmb, 0.55);
  gl.bindVertexArray(fullVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

const toDev = e => [e.clientX*DPR, H - e.clientY*DPR];
cv.addEventListener('pointermove', e => { [lampT.x, lampT.y] = toDev(e); });
cv.addEventListener('pointerdown', e => { const [x, y] = toDev(e); lampT.x = x; lampT.y = y; strike(x, y); });
document.getElementById('fresh').onclick = () => {
  seed = Math.floor(Math.random()*1e5); glaze = GLAZES[(GLAZES.indexOf(glaze) + 1) % GLAZES.length]; reset();
};
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(size, 150); });
size();
requestAnimationFrame(frame);
window.__kintsugi = {strike: (x, y) => strike(x*DPR, H - y*DPR), glaze: i => { glaze = GLAZES[i]; reset(); }};
</script>
</body>
