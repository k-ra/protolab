<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damask — woven from cards</title>
<script src="../vendor/p5.min.js"></script>
<script src="../lib/relief.js"></script>
<script src="../lib/flora.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f2a24;--soft:#6a645b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#efece4;color:var(--ink);overflow:hidden;font-family:'Lora',serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;cursor:crosshair}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:16px;font-style:italic;font-size:14px;color:var(--soft);white-space:nowrap}
.bar button{font:inherit;color:var(--soft);background:none;border:none;cursor:pointer}
.bar button:hover,.bar button:focus-visible{color:var(--ink)}
.back{position:fixed;left:20px;top:18px;font-style:italic;font-size:13px;color:var(--soft);text-decoration:none}
.back:hover{color:var(--ink)}
</style>
</head>
<body>
<a class="back" href="../">Protolab</a>
<div id="stage"></div>
<div class="bar"><button id="weave">punch new cards</button><button id="silk">another silk</button></div>
<script>
// ═══════════════════════════════════════════════════════════════
// DAMASK — a silk woven from punched cards, after Jacquard's loom (1804).
//
// Each card is one pass of the shuttle: where it is punched, a hook lifts
// that warp thread, and the shuttle's weft goes under it. A chain of cards
// is a picture, row by row — the first stored program, and the one Ada
// Lovelace reached for: the Analytical Engine "weaves algebraical patterns
// just as the Jacquard loom weaves flowers and leaves".
//
// This is a damask: one colour of silk throughout. The flower is only a
// change of weave — warp floating on top inside it, weft floating on top
// outside — so it exists only in how each thread takes the light. Under a
// raking lamp (it follows the cursor) the threads running one way catch it
// and the others don't, and the flower comes and goes as the light moves.
// The cards on the left are the actual rows the cloth was woven from.
// ═══════════════════════════════════════════════════════════════

const SILKS = [[46, 92, 98], [226, 216, 194], [120, 40, 52], [64, 70, 110], [176, 140, 70]];
let silk = SILKS[0], seed = 1804, species = 'peony';
let DW, DH, SS, PW, PH, F, art, artCtx, lo = null, ready = false, need = false, moving = 0;
let cov, hgt, nrm, colorMap, bits = null, COLS, ROWS, cell, cloth, cards;
let lamp = {x: 0, y: 0}, lampT = {x: 0, y: 0};

function layout(){
  cell = Math.max(4, Math.round(Math.min(DW, DH)/165));
  const cw = Math.min(DW*0.62, DH*0.86), ch = Math.min(DH*0.86, cw*1.15);
  cloth = {x: DW*0.30 + (DW*0.70 - cw)/2, y: (DH - ch)/2 - 10, w: cw, h: ch};
  COLS = Math.floor(cw/cell); ROWS = Math.floor(ch/cell);
  cards = {x: DW*0.04, y: cloth.y, w: Math.min(DW*0.22, 260), h: ch};
}

// the design, as the card-cutter read it off the squared paper
function design(){
  const W = COLS, H = ROWS, F2 = Relief.field(W, H), rng = Relief.makeRng(seed);
  const spec = Flora.defaults({seed, species, size: Math.min(W, H)*0.27, leaves: 0});
  const parts = Flora.grow(spec);
  // the flower is read off its relief: the grooves between petals stay ground,
  // so each petal is woven as its own shape
  const hf = F2.rasterLuma(c => { c.translate(W/2, H*0.42); Flora.render(c, parts, spec, 'h'); });
  const m = F2.raster(c => {
    // a stem with two leaves, and a border of small lozenges, as on a napkin
    c.fillRect(W/2 - 1, H*0.42, 2, H*0.42);
    [[-1, 0.62], [1, 0.72]].forEach(([sd, t]) => {
      c.save(); c.translate(W/2, H*t); c.rotate(sd*1.0);
      c.beginPath(); c.ellipse(0, -H*0.06, H*0.022, H*0.06, 0, 0, 7); c.fill(); c.restore();
    });
    c.fillRect(W/2 - 1, H*0.46, 2, H*0.38);
    for(let x=4;x<W - 4;x+=8){ c.beginPath(); c.moveTo(x, 3); c.lineTo(x + 3, 6); c.lineTo(x, 9); c.lineTo(x - 3, 6); c.fill(); c.beginPath(); c.moveTo(x, H - 3); c.lineTo(x + 3, H - 6); c.lineTo(x, H - 9); c.lineTo(x - 3, H - 6); c.fill(); }
    c.fillRect(0, 11, W, 1); c.fillRect(0, H - 12, W, 1);
  });
  bits = new Uint8Array(W*H);
  for(let i=0;i<W*H;i++) bits[i] = (m[i] > 0.5 || hf[i] > 0.30) ? 1 : 0;
}

// ── weaving ───────────────────────────────────────────────────
// five-end satin: each thread is tied down once in five, the ties stepped
// by two, so the floats are long and the surface smooth
const tie = (x, y) => ((x*2 + y) % 5) === 0;
function build(){
  const at = c => c.setTransform(SS, 0, 0, SS, 0, 0);
  const h0 = F.rasterLuma(c => {
    at(c);
    c.lineCap = 'round';
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        const fig = bits[y*COLS + x] === 1;
        // in the figure the warp floats on top; in the ground, the weft — except at the ties
        const warpUp = fig ? !tie(x, y) : tie(x, y);
        const cx = cloth.x + (x + 0.5)*cell, cy = cloth.y + (y + 0.5)*cell;
        const ux = warpUp ? 0 : cell*0.52, uy = warpUp ? cell*0.52 : 0;
        c.strokeStyle = 'rgb(150,150,150)'; c.lineWidth = cell*0.92;
        c.beginPath(); c.moveTo(cx - ux, cy - uy); c.lineTo(cx + ux, cy + uy); c.stroke();
        c.strokeStyle = 'rgb(230,230,230)'; c.lineWidth = cell*0.42;          // the round of the thread
        c.beginPath(); c.moveTo(cx - ux*0.9, cy - uy*0.9); c.lineTo(cx + ux*0.9, cy + uy*0.9); c.stroke();
      }
    }
  });
  const body = F.raster(c => { at(c); c.fillRect(cloth.x, cloth.y, COLS*cell, ROWS*cell); });
  const hs = F.blur(h0, Math.max(1, Math.round(0.7*SS)), 2);
  const n2 = PW*PH;
  cov = body; hgt = new Float32Array(n2); colorMap = new Uint8ClampedArray(n2*3);
  const surf = new Float32Array(n2);
  for(let i=0;i<n2;i++){
    if(body[i] < 0.01) continue;
    surf[i] = hs[i]*0.5;
    hgt[i] = 0.4 + 0.6*hs[i];
    // silk is never perfectly even: a slub here and there along the weft
    const y = (i/PW)|0, slub = 1 + (noise(y*0.05/SS, 3) - 0.5)*0.08;
    colorMap[i*3] = silk[0]*slub; colorMap[i*3+1] = silk[1]*slub; colorMap[i*3+2] = silk[2]*slub;
  }
  nrm = F.normals(cov, surf, 22*SS);
  makeLo();
  drawCards();
  need = true;
}

// ── the cards ─────────────────────────────────────────────────
let cardCv = null;
function drawCards(){
  cardCv = Relief.makeCanvas(PW, PH);
  const c = cardCv.getContext('2d'); c.setTransform(SS, 0, 0, SS, 0, 0);
  const K = cards, perCard = 1, holesAcross = Math.min(COLS, 40), step = COLS/holesAcross;
  const cardH = Math.max(9, K.w*0.085), n = Math.floor(K.h/(cardH + 1.5));
  const r = Math.min(K.w/holesAcross*0.28, cardH*0.22);
  for(let k=0;k<n;k++){
    const y = K.y + k*(cardH + 1.5), row = Math.floor(k*ROWS/n);
    c.fillStyle = k % 2 ? '#e8dcc0' : '#e4d6b8';
    c.fillRect(K.x, y, K.w, cardH);
    c.fillStyle = 'rgba(60,46,30,0.12)'; c.fillRect(K.x, y + cardH - 1, K.w, 1);
    // laced together at both ends
    c.strokeStyle = '#8a6f4a'; c.lineWidth = 0.8;
    [K.x + 5, K.x + K.w - 5].forEach(lx => { c.beginPath(); c.moveTo(lx, y - 1); c.lineTo(lx, y + cardH + 1); c.stroke(); });
    // the holes: one for every hook that lifts on this pass
    c.fillStyle = '#3b3128';
    for(let j=0;j<holesAcross;j++){
      const x = Math.floor(j*step);
      if(bits[row*COLS + x] === 1){
        c.beginPath(); c.arc(K.x + 12 + (j + 0.5)*(K.w - 24)/holesAcross, y + cardH/2, r, 0, 7); c.fill();
      }
    }
  }
}

const LO = 3;
function makeLo(){
  const w = Math.floor(PW/LO), h = Math.floor(PH/LO), n = w*h;
  lo = {F: Relief.field(w, h), cov: new Float32Array(n), hgt: new Float32Array(n),
        nX: new Float32Array(n), nY: new Float32Array(n), nZ: new Float32Array(n), colorMap: new Uint8ClampedArray(n*3)};
  lo.cv = Relief.makeCanvas(w, h); lo.ctx = lo.cv.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i = y*w + x, a = (y*LO)*PW + x*LO;
    lo.cov[i] = cov[a]; lo.hgt[i] = hgt[a]; lo.nX[i] = nrm.nX[a]; lo.nY[i] = nrm.nY[a]; lo.nZ[i] = nrm.nZ[a];
    lo.colorMap[i*3] = colorMap[a*3]; lo.colorMap[i*3+1] = colorMap[a*3+1]; lo.colorMap[i*3+2] = colorMap[a*3+2];
  }
}
function shade(preview){
  const k = preview ? 1/LO : 1;
  (preview ? lo.F : F).shade(preview ? lo.ctx : artCtx, {
    cov: preview ? lo.cov : cov, hgt: preview ? lo.hgt : hgt, hMax: 1,
    nX: preview ? lo.nX : nrm.nX, nY: preview ? lo.nY : nrm.nY, nZ: preview ? lo.nZ : nrm.nZ,
    colorMap: preview ? lo.colorMap : colorMap,
    light: {x: lamp.x*SS*k, y: lamp.y*SS*k, h: 150*SS*k, radius: 1600*SS*k, color: '#fff6e6'},
    // silk: a soft, broad sheen and very little ambient, so thread direction is everything
    ambient: 0.16, aoLo: 0.55, exposure: 1.4, gloss: 0.42, sheen: 0.18, wrap: 0.2, specColor: '#fff6ea'
  });
}

// ── p5 ────────────────────────────────────────────────────────
function measure(){
  DW = document.documentElement.clientWidth; DH = window.innerHeight;
  SS = Math.max(1, Math.min(Math.min(devicePixelRatio || 1, 2), Math.sqrt(3.6e6/(DW*DH))));
  PW = Math.round(DW*SS); PH = Math.round(DH*SS);
  F = Relief.field(PW, PH); art = Relief.makeCanvas(PW, PH); artCtx = art.getContext('2d');
}
function boot(){ if(DW < 2) return; layout(); design(); build(); ready = true; }
function setup(){
  pixelDensity(1); measure();
  createCanvas(PW, PH).parent('stage'); fit();
  noiseSeed(1804);
  lamp = {x: DW*0.95, y: DH*0.15}; lampT = {x: DW*0.9, y: DH*0.2};
  boot();
}
function fit(){ const c = document.querySelector('#stage canvas'); c.style.width = DW + 'px'; c.style.height = DH + 'px'; }
function windowResized(){ measure(); resizeCanvas(PW, PH); fit(); boot(); }
function mouseMoved(){ lampT = {x: mouseX/SS, y: mouseY/SS}; }
function touchMoved(){ lampT = {x: mouseX/SS, y: mouseY/SS}; }
function draw(){
  if(!ready) return;
  const dx = lampT.x - lamp.x, dy = lampT.y - lamp.y;
  if(Math.abs(dx) + Math.abs(dy) > 0.8){ lamp.x += dx*0.12; lamp.y += dy*0.12; moving = 5; need = true; }
  if(need){ if(moving > 0){ shade(true); moving--; } else { shade(false); need = false; } }
  const g = drawingContext;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, PW, PH);
  g.save(); g.shadowColor = 'rgba(40,32,24,0.22)'; g.shadowBlur = 16*SS; g.shadowOffsetY = 6*SS;
  g.drawImage(cardCv, 0, 0);
  g.imageSmoothingQuality = 'high';
  if(moving > 0 && lo) g.drawImage(lo.cv, 0, 0, PW, PH); else g.drawImage(art, 0, 0);
  g.restore();
}
const SPECIES = ['peony', 'dahlia', 'rose', 'anemone', 'chrysanth', 'marigold', 'cosmos'];
document.getElementById('weave').onclick = () => { seed = Math.floor(Math.random()*1e5); species = SPECIES[(SPECIES.indexOf(species) + 1) % SPECIES.length]; design(); build(); };
document.getElementById('silk').onclick = () => { silk = SILKS[(SILKS.indexOf(silk) + 1) % SILKS.length]; build(); };
</script>
</body>
</html>
