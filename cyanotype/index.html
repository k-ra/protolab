<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sun Print — algae, after Anna Atkins</title>
<script src="../lib/relief.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f2a24;--soft:#6a645b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#efece4;color:var(--ink);overflow:hidden;font-family:'Lora',serif}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:18px;align-items:center;
  font-style:italic;font-size:14px;color:var(--soft);white-space:nowrap}
.bar button{font:inherit;color:var(--soft);background:none;border:none;cursor:pointer;padding:4px 2px}
.bar button:hover,.bar button:focus-visible{color:var(--ink)}
.bar button[disabled]{opacity:.35;cursor:default}
.back{position:fixed;left:20px;top:18px;font-style:italic;font-size:13px;color:var(--soft);text-decoration:none}
.back:hover{color:var(--ink)}
</style>
</head>
<body>
<a class="back" href="../">Protolab</a>
<canvas id="c"></canvas>
<div class="bar">
  <button id="sun" aria-pressed="false">expose</button>
  <button id="wash">wash</button>
  <button id="fresh">new sheet</button>
</div>
<script>
// ═══════════════════════════════════════════════════════════════
// SUN PRINT — a photogram of algae, after Anna Atkins (1843).
//
// Paper brushed with ferric ammonium citrate and potassium ferricyanide is
// a greenish yellow. Sunlight reduces it to Prussian blue; whatever lies on
// it keeps it from the light. Thick fronds block everything; fine ones let
// a little through, so they print as pale blue ghosts; bladders print as
// rings. Washing carries off the unexposed salts, so the shadow goes white,
// and the blue deepens as it oxidises.
//
// Lay the specimen where you like (drag it), expose for as long as you
// like, then wash. Her labels were written on paper and printed by the same
// light, so the name comes out white as well. The species are invented.
// ═══════════════════════════════════════════════════════════════

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PAPER = [244, 240, 229], COAT = [205, 196, 116], BRONZE = [86, 98, 104], PRUSSIAN = [16, 46, 98];

let DW, DH, SS, sheet, W, H, n2, img;
let coat, expo, mask = null, spec = null, specCv, pos = {x: 0, y: 0};
let sunOn = false, washed = 0, washing = false, last = 0, seed = 1843;
let grain, F;

// ── growing a specimen ────────────────────────────────────────
const SYL = ['ptil','fuc','cerá','plo','del','rhod','chon','spha','cla','dic','lam','pol','sipho','cal','hal'];
const END = ['ota','us','ium','ella','ia','aria','ocladia','yon','ophora','ina'];
const EPI = ['plumosa','nocturna','tenuis','furcata','ramosa','pellucida','crispa','serrata','vesiculosa','gracilis'];
function binomial(rng){
  const g = SYL[Math.floor(rng()*SYL.length)] + END[Math.floor(rng()*END.length)];
  return g[0].toUpperCase() + g.slice(1) + ' ' + EPI[Math.floor(rng()*EPI.length)];
}

// draws onto c as opacity: white is opaque to the sun
function grow(c, rng, kind, scale){
  c.lineCap = 'round'; c.lineJoin = 'round';
  const seg = (x, y, a, len, w, depth) => {
    // a frond is a run of short curving steps
    const steps = 7;
    let px = x, py = y, pa = a;
    const curl = (rng() - 0.5)*0.12;
    for(let i=0;i<steps;i++){
      const nx = px + Math.cos(pa)*len/steps, ny = py + Math.sin(pa)*len/steps;
      const ww = w*(1 - i/steps*0.35);
      c.globalAlpha = Math.min(1, 0.35 + ww*0.35);           // thin parts let light through
      c.lineWidth = ww;
      c.beginPath(); c.moveTo(px, py); c.lineTo(nx, ny); c.stroke();
      if(kind === 'plume' && depth < 3 && i > 0){             // feathery pinnules both sides
        [-1, 1].forEach(sd => {
          const ba = pa + sd*(0.9 + rng()*0.3), bl = len*0.22*(1 - depth*0.2);
          c.globalAlpha = 0.55; c.lineWidth = Math.max(0.5, ww*0.32);
          c.beginPath(); c.moveTo(nx, ny);
          c.quadraticCurveTo(nx + Math.cos(ba)*bl*0.5, ny + Math.sin(ba)*bl*0.5, nx + Math.cos(ba + sd*0.3)*bl, ny + Math.sin(ba + sd*0.3)*bl);
          c.stroke();
        });
      }
      if(kind === 'wrack' && rng() < 0.10 && ww > 3){        // air bladders: a ring and a paler middle
        c.globalAlpha = 1; c.lineWidth = Math.max(1, ww*0.28);
        c.beginPath(); c.ellipse(nx, ny, ww*1.1, ww*1.5, pa, 0, 7); c.stroke();
        c.globalAlpha = 0.45; c.fill();
      }
      px = nx; py = ny; pa += curl + (rng() - 0.5)*0.08;
    }
    if(depth >= (kind === 'thread' ? 7 : 5) || w < 0.6) return;
    if(kind === 'wrack'){                                      // dichotomous: it forks in two
      const sp = 0.32 + rng()*0.2;
      seg(px, py, pa - sp, len*0.82, w*0.78, depth + 1);
      seg(px, py, pa + sp, len*0.82, w*0.78, depth + 1);
    } else if(kind === 'plume'){
      const k = 1 + (rng() < 0.6 ? 1 : 0);
      for(let j=0;j<k;j++) seg(px, py, pa + (rng() - 0.5)*0.9, len*0.78, w*0.72, depth + 1);
    } else {                                                   // threads: fine, many, wandering
      const k = 2 + (rng() < 0.4 ? 1 : 0);
      for(let j=0;j<k;j++) seg(px, py, pa + (rng() - 0.5)*1.1, len*0.80, w*0.70, depth + 1);
    }
  };
  const L = (kind === 'wrack' ? 56 : 48)*scale;
  // a holdfast at the foot, then a few stipes rising from it
  c.globalAlpha = 1; c.beginPath(); c.ellipse(0, 0, 7*scale, 4*scale, 0, 0, 7); c.fill();
  const stipes = kind === 'thread' ? 4 : (kind === 'plume' ? 3 : 2);
  for(let s=0;s<stipes;s++){
    const a = -Math.PI/2 + (s - (stipes - 1)/2)*0.32 + (rng() - 0.5)*0.2;
    seg(0, 0, a, L*(0.9 + rng()*0.3), (kind === 'wrack' ? 7 : kind === 'plume' ? 3.4 : 2.2)*scale, 0);
  }
  c.globalAlpha = 1;
}

function makeSpecimen(){
  const rng = Relief.makeRng(seed);
  const kind = ['wrack', 'plume', 'thread'][Math.floor(rng()*3)];
  const size = Math.round(Math.min(W, H)*0.9);
  specCv = Relief.makeCanvas(size, size);
  const c = specCv.getContext('2d');
  c.translate(size/2, size*0.86);
  c.fillStyle = c.strokeStyle = '#fff';
  grow(c, rng, kind, size/360);
  spec = {name: binomial(rng), kind, size};
  pos = {x: W/2, y: H*0.80};
}

// ── the sheet and its coating ─────────────────────────────────
function makeSheet(){
  const rng = Relief.makeRng(seed + 1);
  n2 = W*H;
  coat = new Float32Array(n2); expo = new Float32Array(n2);
  // brushed on in long horizontal strokes: each edge is a random walk, each
  // stroke leaves bristle lines of its own, and the load fades along it
  const walk = (k) => { const a = new Float32Array(H); let v = 0, u = 0;
    for(let y=0;y<H;y++){ u = u*0.92 + (rng() - 0.5)*0.9; v = v*0.985 + u; a[y] = v; } return a; };
  const smooth = (arr, r) => { const o = new Float32Array(arr.length);
    for(let i=0;i<arr.length;i++){ let t = 0, n = 0; for(let k=-r;k<=r;k++){ const j = i + k; if(j >= 0 && j < arr.length){ t += arr[j]; n++; } } o[i] = t/n; } return o; };
  const eL = walk(), eR = walk();
  const bristle = new Float32Array(H*4);
  for(let i=0;i<bristle.length;i++) bristle[i] = rng();
  const br = smooth(bristle, 2);
  const m = W*0.07, mt = H*0.06;
  for(let y=0;y<H;y++){
    const stroke = Math.floor((y/H)*7), sr = Relief.makeRng(seed*31 + stroke);
    const load = 0.75 + sr()*0.25, dir = sr() < 0.5 ? 1 : -1;
    const l = m + sr()*W*0.03 + eL[y]*SS*0.32, r = W - m - sr()*W*0.03 + eR[y]*SS*0.32;
    const bl = 0.86 + 0.22*(br[y*4 % br.length] - 0.5);
    for(let x=0;x<W;x++){
      let a = Math.min(1, Math.max(0, (x - l)/(SS*2)))*Math.min(1, Math.max(0, (r - x)/(SS*2)));
      a *= Math.min(1, Math.max(0, (y - mt)/(SS*5)))*Math.min(1, Math.max(0, (H - mt - y)/(SS*5)));
      // the brush runs dry toward the end of its stroke
      const t = (x - l)/Math.max(1, r - l), along = dir > 0 ? t : 1 - t;
      const dry = 1 - Math.max(0, along - 0.7)*0.9*(1 - load);
      coat[y*W + x] = a*Math.min(1, bl*dry + (rng() - 0.5)*0.04);
    }
  }
}

// what the sun sees: the specimen and its label, laid where you put them
function layMask(){
  const c = Relief.makeCanvas(W, H), x = c.getContext('2d');
  x.drawImage(specCv, pos.x - spec.size/2, pos.y - spec.size*0.86);
  // the label, written on paper and printed with everything else
  x.fillStyle = '#fff';
  const fs = Math.round(H*0.026);
  x.font = 'italic ' + fs + 'px Lora, Georgia, serif';
  x.textAlign = 'center';
  x.fillText(spec.name, W/2, H*0.91);
  const d = x.getImageData(0, 0, W, H).data;
  const raw = new Float32Array(n2);
  for(let i=0;i<n2;i++) raw[i] = d[i*4 + 3]/255;
  // light creeps a hair under the edges
  mask = F.blur(raw, Math.max(1, Math.round(SS*0.7)), 2);
}

// ── developing ────────────────────────────────────────────────
function render(){
  const d = img.data;
  const wt = washed*washed*(3 - 2*washed);
  for(let i=0;i<n2;i++){
    const c = coat[i], D = 1 - Math.exp(-expo[i]*1.6);
    // before washing: yellow coat, printing out toward slate-bronze
    let r0 = PAPER[0] + (COAT[0] - PAPER[0])*c, g0 = PAPER[1] + (COAT[1] - PAPER[1])*c, b0 = PAPER[2] + (COAT[2] - PAPER[2])*c;
    const pd = D*c*0.85;
    r0 += (BRONZE[0] - r0)*pd; g0 += (BRONZE[1] - g0)*pd; b0 += (BRONZE[2] - b0)*pd;
    // after: the unexposed salts are gone and the blue has deepened
    const bd = Math.min(1, D*1.12)*c;
    const r1 = PAPER[0] + (PRUSSIAN[0] - PAPER[0])*bd, g1 = PAPER[1] + (PRUSSIAN[1] - PAPER[1])*bd, b1 = PAPER[2] + (PRUSSIAN[2] - PAPER[2])*bd;
    d[i*4]   = r0 + (r1 - r0)*wt;
    d[i*4+1] = g0 + (g1 - g0)*wt;
    d[i*4+2] = b0 + (b1 - b0)*wt;
    d[i*4+3] = 255;
  }
  sheet.ctx.putImageData(img, 0, 0);
  // during exposure the specimen is still lying on the sheet
  if(washed === 0){
    sheet.ctx.save();
    sheet.ctx.globalAlpha = 0.82;
    sheet.ctx.filter = 'none';
    sheet.ctx.drawImage(tinted(), pos.x - spec.size/2, pos.y - spec.size*0.86);
    sheet.ctx.restore();
  }
}
let tintCv = null;
function tinted(){
  if(tintCv) return tintCv;
  tintCv = Relief.makeCanvas(spec.size, spec.size);
  const t = tintCv.getContext('2d');
  t.drawImage(specCv, 0, 0);
  t.globalCompositeOperation = 'source-in';
  t.fillStyle = spec.kind === 'wrack' ? '#5b4a2a' : spec.kind === 'plume' ? '#7a2f35' : '#3f5a3a';
  t.fillRect(0, 0, spec.size, spec.size);
  return tintCv;
}

function frame(now){
  const dt = Math.min(0.05, (now - last)/1000 || 0); last = now;
  let changed = false;
  if(sunOn && washed === 0){
    const rate = dt*0.22;
    for(let i=0;i<n2;i++) expo[i] += rate*(1 - mask[i]);
    changed = true;
  }
  if(washing){ washed = Math.min(1, washed + dt/1.8); if(washed >= 1) washing = false; changed = true; }
  if(changed || sheet.dirty){ render(); sheet.dirty = false; }
  paint();
  requestAnimationFrame(frame);
}

function paint(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const x = Math.round((cv.width - W)/2), y = Math.round((cv.height - H)/2 - 14*SS);
  ctx.save();
  ctx.shadowColor = 'rgba(40,34,28,0.22)'; ctx.shadowBlur = 18*SS; ctx.shadowOffsetY = 8*SS;
  ctx.drawImage(sheet.cv, x, y);
  ctx.restore();
  ctx.save();
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.3;
  ctx.fillStyle = grain; ctx.fillRect(x, y, W, H);
  ctx.restore();
  // the sun: a warm wash over the whole desk while it's out
  if(sunOn && washed === 0){
    ctx.save(); ctx.globalCompositeOperation = 'soft-light';
    const g = ctx.createRadialGradient(cv.width*0.2, -cv.height*0.2, 0, cv.width*0.2, -cv.height*0.2, cv.width*1.2);
    g.addColorStop(0, 'rgba(255,236,190,0.55)'); g.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.restore();
  }
  sheet.origin = {x: x/SS, y: y/SS};
}

// ── hands ─────────────────────────────────────────────────────
let drag = null;
cv.addEventListener('pointerdown', e => {
  if(washed > 0 || !sheet.origin) return;
  const lx = (e.clientX - sheet.origin.x)*SS, ly = (e.clientY - sheet.origin.y)*SS;
  if(lx < 0 || ly < 0 || lx >= W || ly >= H || mask[Math.floor(ly)*W + Math.floor(lx)] < 0.05){
    // not on the specimen: bring it to here instead, if nothing has been exposed yet
    return;
  }
  cv.setPointerCapture(e.pointerId);
  drag = {x: e.clientX, y: e.clientY, px: pos.x, py: pos.y};
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', e => {
  if(drag){
    pos.x = drag.px + (e.clientX - drag.x)*SS; pos.y = drag.py + (e.clientY - drag.y)*SS;
    layMask(); sheet.dirty = true;
  } else if(sheet.origin && mask){
    const lx = (e.clientX - sheet.origin.x)*SS, ly = (e.clientY - sheet.origin.y)*SS;
    const on = washed === 0 && lx >= 0 && ly >= 0 && lx < W && ly < H && mask[Math.floor(ly)*W + Math.floor(lx)] > 0.05;
    cv.style.cursor = on ? 'grab' : 'default';
  }
});
cv.addEventListener('pointerup', () => { drag = null; cv.style.cursor = 'default'; });

const sunB = document.getElementById('sun'), washB = document.getElementById('wash');
sunB.onclick = () => {
  if(washed > 0) return;
  sunOn = !sunOn; sunB.textContent = sunOn ? 'shade' : 'expose'; sunB.setAttribute('aria-pressed', sunOn);
};
washB.onclick = () => {
  if(washed > 0) return;
  sunOn = false; sunB.textContent = 'expose'; sunB.disabled = true; washB.disabled = true; washing = true;
};
document.getElementById('fresh').onclick = () => { seed = Math.floor(Math.random()*1e6); start(); };

function start(){
  sunOn = false; washed = 0; washing = false; tintCv = null;
  sunB.textContent = 'expose'; sunB.disabled = false; washB.disabled = false;
  makeSheet(); makeSpecimen(); layMask();
  sheet.dirty = true;
}
function size(){
  DW = innerWidth; DH = innerHeight;
  SS = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(DW*SS); cv.height = Math.round(DH*SS);
  cv.style.width = DW + 'px'; cv.style.height = DH + 'px';
  // a quarto sheet, sized to the window
  const h = Math.min(DH*0.82, DW*0.9/0.78);
  H = Math.round(h*SS); W = Math.round(h*0.78*SS);
  F = Relief.field(W, H);
  sheet = {cv: Relief.makeCanvas(W, H)}; sheet.ctx = sheet.cv.getContext('2d');
  img = sheet.ctx.createImageData(W, H);
  grain = ctx.createPattern(Relief.grainTile(256, 5, 30), 'repeat');
}
let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { size(); start(); }, 200); });
size();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { start(); requestAnimationFrame(frame); });
</script>
</body>
</html>
