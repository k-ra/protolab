<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphogenesis — after Turing</title>
<script src="../vendor/p5.min.js"></script>
<script src="../lib/relief.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f2a24;--soft:#6a645b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#efece4;color:var(--ink);overflow:hidden;font-family:'Lora',serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;cursor:crosshair;touch-action:none}
.bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:14px;font-style:italic;font-size:14px;color:var(--soft);white-space:nowrap;
  background:#efece4;padding:7px 16px;border-radius:2px;box-shadow:0 1px 2px rgba(47,42,36,.14),0 8px 22px -10px rgba(47,42,36,.4)}
.bar button{font:inherit;color:var(--soft);background:none;border:none;cursor:pointer}
.bar button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.bar button:hover,.bar button:focus-visible{color:var(--ink)}
.back{position:fixed;left:16px;top:14px;font-style:italic;font-size:13px;color:var(--soft);text-decoration:none;
  background:#efece4;padding:4px 10px;border-radius:2px;box-shadow:0 1px 2px rgba(47,42,36,.14)}
.back:hover{color:var(--ink)}
</style>
</head>
<body>
<a class="back" href="../">Protolab</a>
<div id="stage"></div>
<div class="bar" id="bar"></div>
<script>
// ═══════════════════════════════════════════════════════════════
// MORPHOGENESIS — after Alan Turing, "The Chemical Basis of
// Morphogenesis" (1952).
//
// Turing proposed that two chemicals, one feeding the other and both
// spreading at different rates, are enough to break a uniform tissue into
// spots, stripes and labyrinths: the leopard's rosettes, the zebrafish's
// bands, the ridges of a fingertip, the folds of brain coral. Here it is the
// Gray–Scott version of his idea, grown live on a grid, and the second
// chemical is read as height — so the pattern grows as an emboss in cotton
// paper, lit by a raking lamp that follows the cursor.
//
// Drag to seed new growth. Each preset is a different feed and kill rate;
// nothing else changes.
// ═══════════════════════════════════════════════════════════════

const PRESETS = [
  {name: 'spots',       f: 0.0300, k: 0.0620},
  {name: 'stripes',     f: 0.0290, k: 0.0570},
  {name: 'coral',       f: 0.0545, k: 0.0620},
  {name: 'dividing',    f: 0.0367, k: 0.0649},
  {name: 'worms',       f: 0.0780, k: 0.0610}
];
let P = PRESETS[1];
let DW, DH, SS, GW, GH, U, V, U2, V2, F, R = 3, RW, RH, art, actx, ready = false;
let lamp = {x: 0, y: 0}, lampT = {x: 0, y: 0}, seeding = null;

function grid(){
  const cell = Math.max(3, Math.round(Math.sqrt(DW*DH/62000)));
  GW = Math.ceil(DW/cell); GH = Math.ceil(DH/cell);
  U = new Float32Array(GW*GH).fill(1); V = new Float32Array(GW*GH);
  U2 = new Float32Array(GW*GH); V2 = new Float32Array(GW*GH);
  // the render field: a few pixels per cell, so the relief is smooth
  RW = GW*R; RH = GH*R;
  F = Relief.field(RW, RH);
  art = Relief.makeCanvas(RW, RH); actx = art.getContext('2d');
  // a scattering of seeds
  for(let s=0;s<40;s++) seed(Math.random()*GW, Math.random()*GH, 3 + Math.random()*3);
}
function seed(cx, cy, r){
  for(let y=Math.floor(cy - r);y<=cy + r;y++) for(let x=Math.floor(cx - r);x<=cx + r;x++){
    if(x < 0 || y < 0 || x >= GW || y >= GH) continue;
    if((x - cx)*(x - cx) + (y - cy)*(y - cy) > r*r) continue;
    const i = y*GW + x; U[i] = 0.5; V[i] = 0.25 + Math.random()*0.05;
  }
}

// one tick of Gray–Scott, five-point Laplacian, wrapping at the edges
function step(){
  const f = P.f, k = P.k, Du = 0.2097, Dv = 0.105;
  for(let y=0;y<GH;y++){
    const yu = (y === 0 ? GH - 1 : y - 1)*GW, yd = (y === GH - 1 ? 0 : y + 1)*GW, row = y*GW;
    for(let x=0;x<GW;x++){
      const xl = x === 0 ? GW - 1 : x - 1, xr = x === GW - 1 ? 0 : x + 1, i = row + x;
      const u = U[i], v = V[i], uvv = u*v*v;
      const lu = U[row + xl] + U[row + xr] + U[yu + x] + U[yd + x] - 4*u;
      const lv = V[row + xl] + V[row + xr] + V[yu + x] + V[yd + x] - 4*v;
      U2[i] = u + Du*lu - uvv + f*(1 - u);
      V2[i] = v + Dv*lv + uvv - (f + k)*v;
    }
  }
  let t = U; U = U2; U2 = t; t = V; V = V2; V2 = t;
}

// V as height, bilinear up to the render field, then lit as paper
let H0 = null, cov = null, hgt = null, cmap = null;
function emboss(){
  const n = RW*RH;
  if(!H0){ H0 = new Float32Array(n); cov = new Float32Array(n).fill(1); hgt = new Float32Array(n).fill(1);
    cmap = new Uint8ClampedArray(n*3); for(let i=0;i<n;i++){ cmap[i*3] = 244; cmap[i*3+1] = 240; cmap[i*3+2] = 230; } }
  for(let y=0;y<RH;y++){
    const gy = Math.min(GH - 1.001, (y + 0.5)/R - 0.5), y0 = Math.max(0, gy|0), y1 = Math.min(GH - 1, y0 + 1), ty = gy - y0;
    for(let x=0;x<RW;x++){
      const gx = Math.min(GW - 1.001, (x + 0.5)/R - 0.5), x0 = Math.max(0, gx|0), x1 = Math.min(GW - 1, x0 + 1), tx = gx - x0;
      const a = V[y0*GW + x0], b = V[y0*GW + x1], c = V[y1*GW + x0], d = V[y1*GW + x1];
      const v = (a*(1 - tx) + b*tx)*(1 - ty) + (c*(1 - tx) + d*tx)*ty;
      // a soft shoulder rather than a cliff: the paper is pressed, not cut
      H0[y*RW + x] = Math.min(1, v*3.2);
    }
  }
  const nrm = F.normals(cov, H0, 9);
  F.shade(actx, {cov, hgt, hMax: 1, nX: nrm.nX, nY: nrm.nY, nZ: nrm.nZ, colorMap: cmap,
    light: {x: lamp.x/DW*RW, y: lamp.y/DH*RH, h: RW*0.16, radius: RW*1.4, color: '#fff6e6'},
    ambient: 0.5, aoLo: 0.7, exposure: 1.06, matte: true, wrap: 0.4, sheen: 0.03, contrast: 1.0,
    tone: {shadow: '#3c3128', high: '#ffffff', amount: 0.08}});
}

let grain;
function setup(){
  pixelDensity(1);
  DW = document.documentElement.clientWidth; DH = innerHeight; SS = Math.min(devicePixelRatio || 1, 2);
  createCanvas(DW*SS, DH*SS).parent('stage'); fitC();
  grain = drawingContext.createPattern(Relief.grainTile(256, 52, 26), 'repeat');
  lamp = {x: DW*0.2, y: DH*0.15}; lampT = {x: DW*0.25, y: DH*0.2};
  if(DW > 2){ grid(); for(let i=0;i<600;i++) step(); ready = true; }
  buildBar();
}
function fitC(){ const c = document.querySelector('#stage canvas'); c.style.width = DW + 'px'; c.style.height = DH + 'px'; }
function windowResized(){ DW = document.documentElement.clientWidth; DH = innerHeight; resizeCanvas(DW*SS, DH*SS); fitC(); if(DW > 2){ H0 = null; grid(); for(let i=0;i<600;i++) step(); ready = true; } }
function mouseMoved(){ lampT = {x: mouseX/SS, y: mouseY/SS}; }
function mouseDragged(){ seedAt(mouseX/SS, mouseY/SS); }
function touchMoved(){ seedAt(mouseX/SS, mouseY/SS); return false; }
function mousePressed(e){ if(e && e.target && e.target.tagName === 'CANVAS') seedAt(mouseX/SS, mouseY/SS); }
function seedAt(x, y){ if(ready) seed(x/DW*GW, y/DH*GH, 2.5); }
function draw(){
  if(!ready) return;
  lamp.x += (lampT.x - lamp.x)*0.12; lamp.y += (lampT.y - lamp.y)*0.12;
  for(let i=0;i<8;i++) step();
  // the chemistry runs every frame; the paper is relit every other one
  if(frameCount % 2 === 0) emboss();
  const g = drawingContext;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(art, 0, 0, width, height);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.22;
  g.fillStyle = grain; g.fillRect(0, 0, width, height);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
}
function buildBar(){
  const bar = document.getElementById('bar');
  PRESETS.forEach(p => {
    const b = document.createElement('button'); b.textContent = p.name; b.setAttribute('aria-pressed', p === P);
    b.onclick = () => { P = p; [...bar.querySelectorAll('button')].forEach(x => x.setAttribute('aria-pressed', x === b)); };
    bar.appendChild(b);
  });
  const c = document.createElement('button'); c.textContent = 'smooth the sheet';
  c.onclick = () => { U.fill(1); V.fill(0); for(let s=0;s<30;s++) seed(Math.random()*GW, Math.random()*GH, 3 + Math.random()*3); };
  bar.appendChild(c);
}
</script>
</body>
</html>
