<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoked Drum — a kymograph</title>
<script src="../lib/relief.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f2a24;--soft:#6a645b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#efece4;color:var(--ink);overflow:hidden;font-family:'Lora',serif}
canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:ns-resize}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:16px;font-style:italic;font-size:14px;color:var(--soft);white-space:nowrap}
.bar button{font:inherit;color:var(--soft);background:none;border:none;cursor:pointer}
.bar button:hover,.bar button:focus-visible{color:var(--ink)}
.back{position:fixed;left:20px;top:18px;font-style:italic;font-size:13px;color:var(--soft);text-decoration:none}
.back:hover{color:var(--ink)}
</style>
</head>
<body>
<a class="back" href="../">Protolab</a>
<canvas id="c"></canvas>
<div class="bar">
  <button id="run" aria-pressed="true">stop the drum</button>
  <button id="fix">fix in shellac</button>
  <button id="smoke">smoke a new sheet</button>
</div>
<script>
// ═══════════════════════════════════════════════════════════════
// SMOKED DRUM — after Carl Ludwig's kymograph, 1847.
//
// Before ink pens were fine enough, physiology wrote with smoke. Paper was
// wrapped round a drum and blackened over a candle; the drum turned at a
// steady rate and a light lever, pivoted on the muscle or the artery,
// scratched its movement through the soot as a white line. Below it a
// chronograph pen ticked off the seconds. Afterwards the sheet was cut off
// and drawn through shellac, which fixed the soot and stained the paper amber.
//
// Move the cursor up and down and the lever follows it, with the lag of
// a real lever on a spring. Leave it and it goes back to recording a
// heart: a beat a little over once a second, riding on slow breathing.
// The drum keeps turning, so old traces are written over.
// ═══════════════════════════════════════════════════════════════

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DW, DH, SS, sheet, sctx, CIRC, SH, drum;
let rot = 0, last = 0, running = true, fixed = 0;
let lever = 0, leverV = 0, target = 0, lastMove = -1e9, prev = null, prevTick = null, t = 0;

function layout(){
  const w = Math.min(DW*0.78, 1000), h = Math.min(DH*0.5, w*0.5);
  drum = {x: (DW - w)/2 + w*0.06, y: (DH - h)/2 - 20, w, h, r: w/2};
  CIRC = Math.round(Math.PI*w*SS);
  SH = Math.round(h*SS);
}

// a sheet blackened over a candle: never quite even
function smoke(){
  sheet = Relief.makeCanvas(CIRC, SH); sctx = sheet.getContext('2d');
  sctx.fillStyle = '#e8dfca'; sctx.fillRect(0, 0, CIRC, SH);
  const img = sctx.createImageData(CIRC, SH), d = img.data, rng = Relief.makeRng(Math.floor(Math.random()*1e6));
  const band = new Float32Array(CIRC);
  let b = 0; for(let x=0;x<CIRC;x++){ b = b*0.995 + (rng() - 0.5)*0.03; band[x] = b; }
  for(let y=0;y<SH;y++){
    for(let x=0;x<CIRC;x++){
      const i = (y*CIRC + x)*4;
      // denser in the middle of each pass of the flame, with fine grain
      const v = 18 + band[x]*120 + Math.sin(y/SH*Math.PI*3 + band[x]*8)*4 + (rng() - 0.5)*14;
      d[i] = v + 4; d[i+1] = v + 2; d[i+2] = v; d[i+3] = 255;
    }
  }
  sctx.putImageData(img, 0, 0);
  fixed = 0; prev = null; prevTick = null;
}

// the heart and the breath, for when no one is moving the lever
function physiology(t){
  const breath = Math.sin(t*2*Math.PI*0.22)*0.18;
  const ph = (t*1.15) % 1;
  const beat = ph < 0.08 ? Math.sin(ph/0.08*Math.PI)*0.75 : (ph < 0.22 ? -Math.sin((ph - 0.08)/0.14*Math.PI)*0.18 : (ph < 0.4 ? Math.sin((ph - 0.22)/0.18*Math.PI)*0.12 : 0));
  return breath + beat;
}

function scratch(u, y, pu, py, w){
  // the stylus skips across the seam of the sheet
  if(Math.abs(u - pu) > CIRC/2) return;
  sctx.save();
  sctx.strokeStyle = 'rgba(236,228,210,0.92)'; sctx.lineWidth = w; sctx.lineCap = 'round';
  sctx.beginPath(); sctx.moveTo(pu, py); sctx.lineTo(u, y); sctx.stroke();
  // soot is torn, not cut: a few grains at the edges
  sctx.fillStyle = 'rgba(236,228,210,0.5)';
  for(let k=0;k<2;k++){ const f = Math.random(); sctx.fillRect(pu + (u - pu)*f + (Math.random() - 0.5)*w*2, py + (y - py)*f + (Math.random() - 0.5)*w*2.4, SS*0.6, SS*0.6); }
  sctx.restore();
}

function frame(now){
  const dt = Math.min(0.05, (now - last)/1000 || 0); last = now;
  if(running){
    t += dt;
    rot = (rot + dt*CIRC/24) % CIRC;                         // one turn in 24 seconds
    // the lever: a spring toward the cursor, or the heart when left alone
    const idle = now - lastMove > 1500;
    const aim = idle ? physiology(t) : target;
    leverV += (aim - lever)*dt*(idle ? 260 : 90); leverV *= Math.pow(0.0008, dt);
    lever += leverV*dt;
    lever = Math.max(-0.95, Math.min(0.95, lever));
    const y = SH*0.42 - lever*SH*0.30;
    if(prev) scratch(rot, y, prev.u, prev.y, 1.3*SS);
    prev = {u: rot, y};
    // the chronograph: a tick each second
    const tickY = SH*0.86 - ((t % 1) < 0.06 ? SH*0.035 : 0);
    if(prevTick) scratch(rot, tickY, prevTick.u, prevTick.y, 1.0*SS);
    prevTick = {u: rot, y: tickY};
  }
  if(fixed > 0 && fixed < 1) fixed = Math.min(1, fixed + dt*0.6);
  paint();
  requestAnimationFrame(frame);
}

function paint(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const D = drum, X = D.x*SS, Y = D.y*SS, W = D.w*SS, H = D.h*SS, R = W/2, cx = X + R;
  // the drum's axle and stand
  ctx.fillStyle = '#5a4a36';
  ctx.fillRect(X - 10*SS, Y + H/2 - 3*SS, W + 20*SS, 6*SS);
  ctx.fillStyle = '#8c7350';
  ctx.fillRect(X - 14*SS, Y - 8*SS, 6*SS, H + 16*SS); ctx.fillRect(X + W + 8*SS, Y - 8*SS, 6*SS, H + 16*SS);
  // the sheet, wrapped: each column of the drum shows the part of the sheet facing it
  ctx.save();
  ctx.shadowColor = 'rgba(40,32,24,0.25)'; ctx.shadowBlur = 20*SS; ctx.shadowOffsetY = 10*SS;
  ctx.fillStyle = '#111'; ctx.fillRect(X, Y, W, H);
  ctx.restore();
  const step = Math.max(1, Math.round(SS));
  for(let x=0;x<W;x+=step){
    const s = (x + step/2 - R)/R, phi = Math.asin(Math.max(-1, Math.min(1, s)));
    // the stylus writes on the front of the drum; the sheet moves right to left under it
    let u = (rot + phi*R*Math.PI/Math.PI) % CIRC; if(u < 0) u += CIRC;
    const span = (Math.asin(Math.min(1, (x + step - R)/R)) - Math.asin(Math.max(-1, (x - R)/R)))*R;
    ctx.drawImage(sheet, u, 0, Math.max(1, span), SH, X + x, Y, step, H);
  }
  // shellac: amber and a little glossy
  if(fixed > 0){
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.55*fixed;
    ctx.fillStyle = '#c99a52'; ctx.fillRect(X, Y, W, H); ctx.restore();
  }
  // the cylinder: dark toward its edges, a soft highlight band near the top
  const g = ctx.createLinearGradient(X, 0, X + W, 0);
  g.addColorStop(0, 'rgba(0,0,0,0.7)'); g.addColorStop(0.18, 'rgba(0,0,0,0.12)'); g.addColorStop(0.42, 'rgba(255,255,255,0.10)');
  g.addColorStop(0.55, 'rgba(0,0,0,0)'); g.addColorStop(0.85, 'rgba(0,0,0,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = g; ctx.fillRect(X, Y, W, H);
  // the lever: a brass arm pivoted to the left, its pen resting on the drum's front
  const ly = Y + (0.42*H - lever*H*0.30), px = cx, pivotX = X - Math.min(160*SS, X*0.8), pivotY = Y + H*0.42;
  ctx.strokeStyle = '#a8864a'; ctx.lineWidth = 2.2*SS; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(px, ly); ctx.stroke();
  ctx.fillStyle = '#6e5634'; ctx.beginPath(); ctx.arc(pivotX, pivotY, 6*SS, 0, 7); ctx.fill();
  ctx.strokeStyle = '#d9cfb6'; ctx.lineWidth = 1*SS; ctx.beginPath(); ctx.moveTo(px - 10*SS, ly); ctx.lineTo(px + 2*SS, ly + 1*SS); ctx.stroke();
  // the chronograph pen
  const ty = Y + SH*0.86/SH*H;
  ctx.strokeStyle = '#7d6a4c'; ctx.lineWidth = 1.6*SS;
  ctx.beginPath(); ctx.moveTo(pivotX + Math.min(60*SS, X*0.3), ty + 30*SS); ctx.lineTo(px, ty); ctx.stroke();
  // labels a physiologist would have pencilled on the bench card
  ctx.fillStyle = '#6a645b'; ctx.font = 'italic ' + (12*SS) + 'px Lora, serif';
  ctx.fillText('lever', pivotX - 10*SS, pivotY - 14*SS);
  ctx.fillText('1 s', pivotX + 50*SS, ty + 48*SS);
}

cv.addEventListener('pointermove', e => {
  const D = drum; target = Math.max(-1, Math.min(1, -((e.clientY - D.y)/D.h - 0.42)/0.30)); lastMove = performance.now();
});
const runB = document.getElementById('run');
runB.onclick = () => { running = !running; runB.textContent = running ? 'stop the drum' : 'turn the drum'; runB.setAttribute('aria-pressed', running); prev = null; prevTick = null; };
document.getElementById('fix').onclick = () => { if(!fixed){ fixed = 0.001; running = false; runB.textContent = 'turn the drum'; } };
document.getElementById('smoke').onclick = () => { smoke(); running = true; runB.textContent = 'stop the drum'; };

function size(){
  DW = innerWidth; DH = innerHeight; SS = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(DW*SS); cv.height = Math.round(DH*SS); cv.style.width = DW + 'px'; cv.style.height = DH + 'px';
  layout(); smoke();
}
let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(size, 200); });
size();
requestAnimationFrame(frame);
</script>
</body>
</html>
