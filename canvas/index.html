<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clippings</title>
<script src="../vendor/p5.min.js"></script>
<script src="../lib/relief.js"></script>
<script src="../lib/dies.js"></script>
<script src="../lib/flora.js"></script>
<script src="../lib/press.js"></script>
<script src="../lib/matter.js"></script>
<script src="../lib/hub.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f2a24;--soft:#8b857c;--line:rgba(47,42,36,.13);--panel:rgba(255,255,255,.95)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;font-weight:300;color:var(--ink);background:#fbfaf7}
#sheet{position:relative;width:100%}
#stage canvas{display:block;cursor:default}
#labels{position:absolute;inset:0;pointer-events:none;z-index:3}
.cap{position:absolute;text-align:center;transform:translateX(-50%)}
.cap b{display:block;font-size:10.5px;font-weight:400;letter-spacing:.19em;text-transform:uppercase}
.cap i{display:block;font-family:'Lora',serif;font-style:italic;font-size:11.5px;color:var(--soft);margin-top:3px}
.cap.sel b{color:#000}
.cap u{display:block;text-decoration:none;font-size:10.5px;color:var(--soft);margin-top:4px;
  font-family:'Lora',serif;font-style:italic;max-width:210px;margin-left:auto;margin-right:auto;line-height:1.45}

.sheetmark{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;text-align:center}
.sheetmark b{display:block;font-size:12px;font-weight:400;letter-spacing:.38em;text-transform:uppercase}

.bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:8;
  display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 26px rgba(47,42,36,.09)}
.bar button{border:none;background:none;font-family:inherit;font-weight:400;font-size:12.5px;
  letter-spacing:.05em;color:var(--ink);padding:8px 13px;border-radius:999px;cursor:pointer;transition:background .16s}
.bar button:hover{background:rgba(47,42,36,.07)}
.bar .div{width:1px;height:18px;background:var(--line);margin:0 3px}
.bar .plus{font-size:16px;padding:5px 14px 7px}

.panel{position:fixed;z-index:9;width:270px;padding:20px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);box-shadow:0 14px 40px rgba(47,42,36,.13);
  max-height:calc(100vh - 120px);overflow-y:auto;display:none}
#inspector{top:28px;right:28px}
#notes{top:28px;left:28px;width:330px}
.panel h2{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);
  font-weight:400;margin-bottom:15px;display:flex;justify-content:space-between}
.panel h2 span{cursor:pointer;letter-spacing:0;font-size:15px;line-height:1}
.row{margin-bottom:14px}
.row label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
.row .val{float:right;font-family:'Courier New',monospace;letter-spacing:0;text-transform:none}
input[type=range]{width:100%;height:2px;background:var(--line);border-radius:2px;outline:none;-webkit-appearance:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--ink);border-radius:50%;cursor:pointer}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.chips.three{grid-template-columns:1fr 1fr 1fr}
.chips button{border:1px solid var(--line);background:none;font-family:inherit;font-weight:300;font-size:11.5px;
  padding:7px 3px;border-radius:7px;cursor:pointer;color:var(--ink);transition:all .16s}
.chips button:hover{border-color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wide{width:100%;border:1px solid var(--line);background:none;font-family:inherit;font-weight:300;font-size:12px;
  padding:9px;border-radius:8px;cursor:pointer;color:var(--ink);transition:all .16s}
.wide:hover{border-color:var(--ink)}
.wide.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.wide.danger:hover{border-color:#a8564a;color:#a8564a}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:'Lora',serif;
  font-size:12.5px;line-height:1.6;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--ink)}
.hint{font-size:11px;color:var(--soft);line-height:1.6;margin-top:9px}
</style>
</head>
<body>
<div id="sheet">
  <div id="stage"></div>
  <div id="labels"></div>
  <div class="sheetmark"><b>Clippings</b></div>
</div>

<div class="bar">
  <button class="plus" onclick="addPressing()" title="add a pressing">+</button>
  <button onclick="shuffleAll()">Shuffle</button>
  <button onclick="fillSet()">Full set</button>
  <button onclick="clearAll()">Clear</button>
  <div class="div"></div>
  <button onclick="togglePanel('notes')">Notes</button>
  <button onclick="downloadPNG()">PNG</button>
</div>

<div class="panel" id="inspector">
  <h2><span id="i-title">Pressing</span><span onclick="deselect()">×</span></h2>
  <div class="row"><label>Material</label><div class="chips" id="i-mat"></div></div>
  <div class="row"><label>Medium</label><div class="chips" id="i-medium"></div></div>
  <div class="row"><label>Form</label><div class="chips" id="i-form"></div></div>
  <div class="row" id="row-content"><label>Pressed with</label><div class="chips" id="i-content"></div></div>
  <div class="row"><label>Scale <span class="val" id="v-scale"></span></label>
    <input type="range" id="i-scale" min="0.5" max="1.5" step="0.02" oninput="setField('scale',+this.value)"></div>
  <div class="row"><label>Impression <span class="val" id="v-depth"></span></label>
    <input type="range" id="i-depth" min="0.3" max="2" step="0.05" oninput="setField('depth',+this.value)"></div>
  <div class="row" id="row-ink"><label>Ink</label>
    <div class="swatchrow" style="display:flex;gap:7px">
      <input type="color" id="i-ink1" oninput="setField('ink1',this.value)" style="width:26px;height:26px;border:none;border-radius:5px;background:none;padding:0;cursor:pointer">
      <input type="color" id="i-ink2" oninput="setField('ink2',this.value)" style="width:26px;height:26px;border:none;border-radius:5px;background:none;padding:0;cursor:pointer">
    </div></div>
  <div class="row" id="row-name"><label>Plate name</label>
    <input type="text" id="i-name" style="width:100%;border:1px solid var(--line);background:#fff;font-family:'Lora',serif;font-size:13px;padding:8px;border-radius:8px;color:var(--ink);text-align:center;letter-spacing:.08em" oninput="setField('name',this.value)"></div>
  <div class="row"><label>Note</label>
    <textarea id="i-note" rows="3" placeholder="what you like about it" oninput="setField('note',this.value)"></textarea></div>
  <div class="row"><button class="wide" onclick="reseedSel()">New seed</button></div>
  <div class="row"><button class="wide solid" onclick="openStudy()">Open study ↗</button></div>
  <div class="row" style="margin-bottom:0"><button class="wide danger" onclick="removeSel()">Remove</button></div>
</div>

<div class="panel" id="notes">
  <h2>Notes <span onclick="togglePanel('notes')">×</span></h2>
  <div class="row"><label>About this sheet</label>
    <textarea id="sheet-note" rows="4" placeholder="what you're looking for" oninput="setSheetNote(this.value)"></textarea></div>
  <div class="row"><label>Rake <span class="val" id="v-lightHeight"></span></label>
    <input type="range" id="s-lightHeight" min="60" max="900" step="10" oninput="showLight('h',+this.value)" onchange="setLight('h',+this.value)"></div>
  <div class="row"><label>Grain <span class="val" id="v-grainAmt"></span></label>
    <input type="range" id="s-grainAmt" min="0" max="0.5" step="0.02" oninput="setLight('grain',+this.value)"></div>
  <div class="row"><button class="wide" onclick="copyNotes()">Copy notes for Claude</button></div>
  <div class="row" style="margin-bottom:0"><button class="wide" onclick="copyState()">Copy whole sheet</button></div>
  <div class="hint">Notes copy out as markdown — paste them to me and I'll act on them.</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// CLIPPINGS — a swatch book.
//
// The ground never changes: one white sheet, one fixed light. The only
// variable is MATERIAL, which is why the relief field carries a per-pixel
// material map — wax, brass, plaster and paper all lit by the same lamp,
// each answering it differently.
//
// Rendered at full resolution. Nothing here needs to relight at 60fps, and
// crispness matters more than motion.
// ═══════════════════════════════════════════════════════════════

const GROUND = '#fbfaf7';
const CELL_W = 300, CELL_H = 300, CAP_H = 66;
const TOP_PAD = 132, BOT_PAD = 130;

// Render at the display's real pixel density — a 1x buffer stretched over a
// retina screen is what made this look pixelated. But a tall sheet at 2x is
// millions of pixels held in a dozen Float32Arrays, so the density is capped
// by a pixel budget: short sheets stay fully crisp, long ones degrade.
const PIXEL_BUDGET = 4.5e6;
function densityFor(w, h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const fit = Math.sqrt(PIXEL_BUDGET/Math.max(1, w*h));
  return Math.max(1, Math.min(dpr, fit));
}
let SS = Math.min(window.devicePixelRatio || 1, 2);

let DW, DH, PW, PH, COLS;
let F, artCv, artCtx, grainPat;
let cov, hgt, colorMap, matMap, nrm, hMax = 1;
let needBuild = false, needShade = false, ready = false;

let items = [];
let sheetNote = '';
let selected = -1;
let L = {ang: 214, h: 330, radius: 2200, grain: 0.22};
let lampT = {x:0, y:0}, lampP = {x:0, y:0};
let lampMoving = 0;

const FORMS = ['seal','bloom','card','exlibris'];
// A medium is how the mark is MADE. Relief is lit; the printed media are flat
// and unlit — ink doesn't catch a raking light, it just sits on the paper.
const MEDIA = ['relief','ink','twotone','pencil'];
const MEDIUM_LABEL = {relief:'Pressed', ink:'Ink', twotone:'Two-tone', pencil:'Pencil'};
const CONTENTS = ['die','flower'];
const STORE = 'protolab.clippings.v1';

// ── a pressing ─────────────────────────────────────────────────
function newPressing(over){
  const rng = Relief.makeRng(Math.floor(Math.random()*999999)+1);
  const mat = Matter.NAMES[Math.floor(rng()*Matter.NAMES.length)];
  return Object.assign({
    material: mat,
    form: FORMS[Math.floor(rng()*FORMS.length)],
    content: CONTENTS[Math.floor(rng()*CONTENTS.length)],
    medium: 'relief',
    ink1: '#2b2a30', ink2: '#a8443a',
    name: 'KYRA MO',
    scale: 1, depth: 1, note: '',
    seed: Math.floor(rng()*999999)+1,
    die: ['monogram','crest','figure'][Math.floor(rng()*3)],
    text: 'K',
    species: Flora.NAMES[Math.floor(rng()*Flora.NAMES.length)]
  }, over || {});
}
// which body shape a material takes when it's pressed
const SHAPE_OF = {wax:'wax', slate:'wax', clay:'clay', plaster:'clay',
                  paper:'paper', vellum:'paper', brass:'metal', pewter:'metal'};

function specFor(it){
  const M = Matter.get(it.material);
  if(it.form === 'bloom' || (it.form === 'card' && it.content === 'flower')){
    return Flora.defaults({
      seed: it.seed, species: it.species, size: 92*it.scale, leaves: 0,
      // the flower is made OF the material, so its palette comes from it
      cBase: Flora.mixHex(M.color, '#000000', 0.22),
      cTip:  Flora.mixHex(M.color, '#ffffff', 0.20),
      cDisc: Flora.mixHex(M.color, '#000000', 0.34),
      cLeaf: Flora.mixHex(M.color, '#000000', 0.10)
    });
  }
  return Press.defaults({
    seed: it.seed, substrate: SHAPE_OF[it.material] || 'wax',
    die: it.die, text: it.text, color: M.color,
    size: 92*it.scale, detail: 6, depth: it.depth, mode: 'deboss'
  });
}

// card body — a small sheet of the material, softly deckled
function cardPath(ctx, R, seed){
  const rng = Relief.makeRng(seed);
  const w = R*1.18, h = R*0.92, steps = 180;
  const ph = [rng()*6.28, rng()*6.28, rng()*6.28];
  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    const t = i/steps, per = t*4;
    let x, y, nx, ny;
    if(per < 1){ x = -w + 2*w*per; y = -h; nx = 0; ny = -1; }
    else if(per < 2){ x = w; y = -h + 2*h*(per-1); nx = 1; ny = 0; }
    else if(per < 3){ x = w - 2*w*(per-2); y = h; nx = 0; ny = 1; }
    else { x = -w; y = h - 2*h*(per-3); nx = -1; ny = 0; }
    const n = (Math.sin(per*6.7+ph[0])*0.5 + Math.sin(per*15.1+ph[1])*0.3 + Math.sin(per*29.3+ph[2])*0.2)*R*0.022;
    if(i===0) ctx.moveTo(x+nx*n, y+ny*n); else ctx.lineTo(x+nx*n, y+ny*n);
  }
  ctx.closePath();
}

// a bookplate — border, EX LIBRIS, an ornament, a name
function exlibris(ctx, it, R){
  const w = R*0.86, h = R*1.12;
  ctx.lineJoin = 'miter';
  ctx.lineWidth = R*0.030;
  ctx.strokeRect(-w, -h, w*2, h*2);
  ctx.lineWidth = R*0.012;
  ctx.strokeRect(-w*0.90, -h*0.92, w*1.80, h*1.84);
  const rng = Relief.makeRng(it.seed);
  ctx.save();
  ctx.translate(0, -h*0.34);
  Dies.tracked(ctx, 'EX LIBRIS', 0, R*0.115, 0.42, '500');
  ctx.restore();
  ctx.save();
  ctx.translate(0, h*0.02);
  if(it.die === 'crest') Dies.crest(ctx, R*0.40, rng, 7);
  else if(it.die === 'figure') Dies.rosette(ctx, R*0.34, 8);
  else Dies.monogram(ctx, R*0.34, (it.text || 'K'));
  ctx.restore();
  ctx.save();
  ctx.translate(0, h*0.56);
  ctx.lineWidth = R*0.010;
  ctx.beginPath(); ctx.moveTo(-w*0.62, -R*0.11); ctx.lineTo(w*0.62, -R*0.11); ctx.stroke();
  Dies.tracked(ctx, it.name || 'KYRA MO', R*0.10, R*0.082, 0.34, '400');
  ctx.restore();
}

// height for one pressing, drawn at the origin
function pressingHeight(ctx, it){
  const R = 92*it.scale;
  if(it.form === 'exlibris'){
    ctx.fillStyle = 'rgb(150,150,150)';
    cardPath(ctx, R*1.24, it.seed);
    ctx.fill();
    ctx.save();
    ctx.globalAlpha = 0.55*it.depth;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff';
    exlibris(ctx, it, R*0.80);
    ctx.restore();
  } else if(it.form === 'seal'){
    Press.stamp(ctx, specFor(it), 'h');
  } else if(it.form === 'bloom'){
    Flora.render(ctx, it._parts, specFor(it), 'h');
  } else {
    ctx.fillStyle = 'rgb(150,150,150)';        // the card sits at mid height
    cardPath(ctx, R*1.15, it.seed);
    ctx.fill();
    ctx.save();
    // drawn at partial alpha, so the content MODULATES the card's level
    // instead of replacing it — a blind emboss, raised out of the sheet
    if(it.content === 'flower'){
      ctx.globalAlpha = 0.55*it.depth;
      const s = specFor(it);
      s.size = R*0.66;
      Flora.render(ctx, Flora.grow(s), s, 'h');
    } else {
      ctx.globalAlpha = 0.62*it.depth;
      const s = specFor(it);
      s.size = R*0.62;
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff';
      Dies.ring(ctx, s.size*0.90, s.size*0.028);
      Dies.monogram(ctx, s.size*0.60, it.text || 'K');
    }
    ctx.restore();
  }
}
// silhouette, for the material map
function pressingMask(ctx, it){
  const R = 92*it.scale;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  if(it.form === 'exlibris'){
    cardPath(ctx, R*1.24, it.seed); ctx.fill();
  } else if(it.form === 'seal'){
    Press.stamp(ctx, specFor(it), 'c');
  } else if(it.form === 'bloom'){
    Flora.render(ctx, it._parts, specFor(it), 'c');
  } else {
    cardPath(ctx, R*1.15, it.seed); ctx.fill();
  }
}

// The printed design, as distinct from the body: an inked seal prints its
// die, not its blob of wax.
function pressingInk(ctx, it){
  const R = 92*it.scale;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const rng = Relief.makeRng(it.seed);
  if(it.form === 'exlibris'){
    exlibris(ctx, it, R*0.80);
  } else if(it.form === 'bloom'){
    Flora.render(ctx, it._parts, specFor(it), 'c');
  } else if(it.form === 'card'){
    if(it.content === 'flower'){
      const sp = specFor(it); sp.size = R*0.66;
      Flora.render(ctx, Flora.grow(sp), sp, 'c');
    } else {
      Dies.ring(ctx, R*0.56, R*0.020);
      Dies.monogram(ctx, R*0.38, it.text || 'K');
    }
  } else {
    ctx.save();
    Dies.ring(ctx, R*0.70, R*0.024);
    Dies.ring(ctx, R*0.60, R*0.012);
    if(it.die === 'crest') Dies.crest(ctx, R*0.46, rng, 7);
    else if(it.die === 'figure') Dies.rosette(ctx, R*0.44, 9);
    else Dies.monogram(ctx, R*0.44, it.text || 'K');
    ctx.restore();
  }
}

// ── layout ─────────────────────────────────────────────────────
// the sheet is as tall as it needs to be, and the page scrolls
function layout(){
  COLS = Math.max(1, Math.floor((DW - 80)/CELL_W));
  const rows = Math.ceil(items.length/COLS) || 1;
  const gridW = COLS*CELL_W, gridH = rows*(CELL_H + CAP_H);
  const ox = (DW - gridW)/2 + CELL_W/2;
  const oy = TOP_PAD + CELL_H/2;
  items.forEach((it, i) => {
    it.x = ox + (i % COLS)*CELL_W;
    it.y = oy + Math.floor(i/COLS)*(CELL_H + CAP_H);
  });
  return Math.max(window.innerHeight, TOP_PAD + gridH + BOT_PAD);
}
function reflow(){
  const need = layout();
  if(Math.abs(need - DH) > 1){ DH = need; allocate(); resizeCanvas(PW, PH); styleCanvas(); }
}

function build(){
  reflow();
  items.forEach(it => {
    if(it.form === 'bloom') it._parts = Flora.grow(specFor(it));
  });

  const h0 = F.rasterLuma(ctx => {
    ctx.scale(SS, SS);
    items.forEach(it => { ctx.save(); ctx.translate(it.x, it.y); pressingHeight(ctx, it); ctx.restore(); });
  });
  // only the coverage is used — raster() returns alpha alone, where
  // rasterColor() would also allocate a colour map the size of the sheet
  const mkCov = F.raster(ctx => {
    ctx.scale(SS, SS);
    items.forEach(it => { ctx.save(); ctx.translate(it.x, it.y); pressingMask(ctx, it); ctx.restore(); });
  });
  const inkCov = F.raster(ctx => {
    ctx.scale(SS, SS);
    items.forEach(it => {
      if(it.medium === 'relief') return;
      ctx.save(); ctx.translate(it.x, it.y); pressingInk(ctx, it); ctx.restore();
    });
  });
  const sm = F.blur(h0, Math.round(SS), 2);    // just enough to round an edge
  const n2 = PW*PH;
  const OFF = Math.round(3*SS);                 // two-tone misregistration

  // keep a real array here rather than a null sentinel: making the shader's
  // coverage read polymorphic deoptimises the hot loop by an order of magnitude
  cov = new Float32Array(n2).fill(1);
  colorMap = new Uint8ClampedArray(n2*3);
  matMap = new Uint8Array(n2);
  const surf = new Float32Array(n2);
  hgt = new Float32Array(n2);
  hMax = 1;

  // material 0 is the ground; 1..n are the materials actually in use
  const used = [], idxOf = {};
  Matter.NAMES.forEach(k => {
    if(items.some(it => it.material === k && (it.medium || 'relief') === 'relief')){ idxOf[k] = used.length + 1; used.push(k); }
  });
  const palette = [Relief.hexRgb(GROUND)].concat(used.map(k => Relief.hexRgb(Matter.get(k).color)));
  const reliefOf = [0.6].concat(used.map(k => Matter.get(k).relief));
  const toothOf  = [0.004].concat(used.map(k => Matter.get(k).tooth));
  // index 0 is the ground: ambient 1 means the lamp cannot touch it, so the
  // sheet stays exactly one white behind every material
  materialsForShade = [{ambient:1, aoLo:1, exposure:1, gloss:0, sheen:0, scatter:0, env:false}]
    .concat(used.map(k => Matter.response(k)));

  // which cell a pixel belongs to tells us its material — cells never overlap
  const cellOf = new Int16Array(n2);
  cellOf.fill(-1);
  items.forEach((it, i) => {
    const x0 = Math.max(0, Math.round((it.x - CELL_W/2)*SS)), x1 = Math.min(PW, Math.round((it.x + CELL_W/2)*SS));
    const y0 = Math.max(0, Math.round((it.y - CELL_H/2)*SS)), y1 = Math.min(PH, Math.round((it.y + CELL_H/2)*SS));
    for(let y=y0;y<y1;y++){
      const row = y*PW;
      for(let x=x0;x<x1;x++) cellOf[row+x] = i;
    }
  });

  for(let y=0;y<PH;y++){
    for(let x=0;x<PW;x++){
      const i = y*PW + x, m = i*3;
      const c = cellOf[i];
      const med = c >= 0 ? (items[c].medium || 'relief') : 'relief';
      const gc = palette[0];

      if(med !== 'relief'){
        // printed: flat and unlit. material 0 has ambient 1, so the lamp
        // cannot touch it — ink stays the same colour wherever you move it.
        matMap[i] = 0;
        surf[i] = 0.5;
        hgt[i] = 1;
        let r = gc[0], g = gc[1], b = gc[2];
        const it = items[c];
        if(med === 'pencil'){
          // a rubbing: graphite catches whatever stands proud of the paper
          const rel = sm[i]*mkCov[i];
          const tooth = 0.55 + 0.45*noise(x*0.5/SS, y*0.5/SS);
          const d = Math.min(1, Math.pow(rel, 1.7)*1.9)*tooth*0.92;
          const gr = Relief.hexRgb('#3c3b40');
          r += (gr[0]-r)*d; g += (gr[1]-g)*d; b += (gr[2]-b)*d;
        } else {
          const tex = 0.66 + 0.5*noise(x*0.34/SS, y*0.34/SS);   // broken coverage
          const a1 = Math.min(1, inkCov[i]*tex);
          const c1 = Relief.hexRgb(it.ink1 || '#2b2a30');
          if(med === 'twotone'){
            const j = i + OFF + OFF*PW;
            const a2 = j < n2 ? Math.min(1, inkCov[j]*tex) : 0;
            const c2 = Relief.hexRgb(it.ink2 || '#a8443a');
            r *= (1 - a2*(1 - c2[0]/255));       // multiply, like overprinting
            g *= (1 - a2*(1 - c2[1]/255));
            b *= (1 - a2*(1 - c2[2]/255));
          }
          r *= (1 - a1*(1 - c1[0]/255));
          g *= (1 - a1*(1 - c1[1]/255));
          b *= (1 - a1*(1 - c1[2]/255));
        }
        colorMap[m] = r; colorMap[m+1] = g; colorMap[m+2] = b;
        continue;
      }

      const a = mkCov[i];
      const mi = (a > 0.5 && c >= 0) ? (idxOf[items[c].material] || 0) : 0;
      matMap[i] = mi;

      const pc = palette[mi];
      const t = mi === 0 ? 0 : Math.min(1, a*1.6);
      colorMap[m]   = gc[0] + (pc[0]-gc[0])*t;
      colorMap[m+1] = gc[1] + (pc[1]-gc[1])*t;
      colorMap[m+2] = gc[2] + (pc[2]-gc[2])*t;

      const tooth = (noise(x*0.09/SS, y*0.09/SS) - 0.5)*toothOf[mi];
      const rel = sm[i]*a;
      surf[i] = 0.5 + tooth + rel*0.62*reliefOf[mi];
      const ao = (1 - (0.72 - rel*0.80)*(mi === 0 ? 0 : 1));
      hgt[i] = ao > 0 ? ao : 0;
    }
  }
  nrm = F.normals(cov, surf, 46*SS);           // crisp: steep normals, tiny blur
  makeLo();
  needShade = true;
  renderLabels();
}

let materialsForShade = null;

// While the lamp is moving we light a half-size copy of the field — a quarter
// of the pixels — and upscale it. When it settles we light the real thing.
// The buffers are downsampled once per build, so this costs nothing per frame.
let lo = null;
const LO_DIV = 3;                 // a ninth of the pixels while the lamp moves
function makeLo(){
  const lw = Math.max(2, Math.floor(PW/LO_DIV)), lh = Math.max(2, Math.floor(PH/LO_DIV));
  const n = lw*lh;
  const o = {W: lw, H: lh, F: Relief.field(lw, lh),
             cov: new Float32Array(n).fill(1), hgt: new Float32Array(n),
             nX: new Float32Array(n), nY: new Float32Array(n), nZ: new Float32Array(n),
             colorMap: new Uint8ClampedArray(n*3), matMap: new Uint8Array(n)};
  o.cv = Relief.makeCanvas(lw, lh); o.ctx = o.cv.getContext('2d');
  for(let y=0;y<lh;y++){
    for(let x=0;x<lw;x++){
      const i = y*lw + x;
      const a0 = (y*LO_DIV)*PW + x*LO_DIV;
      o.hgt[i] = hgt[a0];
      o.nX[i]  = nrm.nX[a0]; o.nY[i] = nrm.nY[a0]; o.nZ[i] = nrm.nZ[a0];
      o.matMap[i] = matMap[a0];
      o.colorMap[i*3]   = colorMap[a0*3];
      o.colorMap[i*3+1] = colorMap[a0*3+1];
      o.colorMap[i*3+2] = colorMap[a0*3+2];
    }
  }
  lo = o;
}

function shade(preview){
  const k = preview ? 1/LO_DIV : 1;
  const src = preview ? lo : null;
  const field = preview ? lo.F : F;
  const target = preview ? lo.ctx : artCtx;
  field.shade(target, {
    cov: preview ? lo.cov : cov, hgt: preview ? lo.hgt : hgt, hMax: hMax,
    nX: preview ? lo.nX : nrm.nX, nY: preview ? lo.nY : nrm.nY, nZ: preview ? lo.nZ : nrm.nZ,
    colorMap: preview ? lo.colorMap : colorMap,
    matMap: preview ? lo.matMap : matMap, materials: materialsForShade,
    light: {x: lampP.x*SS*k, y: lampP.y*SS*k,
            h: L.h*SS*k, radius: L.radius*SS*k, color: '#fffaf2'},
    matte: true, contrast: 0.94, wrap: 0.42,
    tone: {shadow:'#2b2721', high:'#ffffff', amount: 0.10}
  });
}

// ── p5 ─────────────────────────────────────────────────────────
function allocate(){
  SS = densityFor(DW, DH);
  PW = Math.round(DW*SS); PH = Math.round(DH*SS);
  F = Relief.field(PW, PH);
  artCv = Relief.makeCanvas(PW, PH); artCtx = artCv.getContext('2d');
  grainPat = artCtx.createPattern(Relief.grainTile(256, 4242, 26), 'repeat');
}
function styleCanvas(){
  const c = document.querySelector('#stage canvas');
  if(c){ c.style.width = DW + 'px'; c.style.height = DH + 'px'; }
  document.getElementById('sheet').style.height = DH + 'px';
  document.getElementById('labels').style.height = DH + 'px';
}
function setup(){
  pixelDensity(1);
  DW = Math.max(720, document.documentElement.clientWidth);
  DH = Math.max(520, window.innerHeight);
  allocate();
  createCanvas(PW, PH).parent('stage');
  styleCanvas();
  noiseSeed(11);
  restore();
  buildChips(); syncUI();
  lampT = {x: DW*0.28, y: DH*0.22};
  lampP = {x: DW*0.28, y: DH*0.22};
  const boot = () => {
    if(!items.length) fillSet();
    else { build(); }
    // The first call into the shader is 5-10x slower than the steady state
    // while it JITs. Pay that on the small preview buffer instead of on the
    // full-resolution pass, so the sheet doesn't hitch as it appears.
    for(let i=0;i<3;i++) shade(true);
    shade(false);
    needShade = false; lampMoving = 0;
    ready = true;
  };
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(boot).catch(boot);
  else boot();
}
function windowResized(){
  DW = Math.max(720, document.documentElement.clientWidth);
  DH = Math.max(520, window.innerHeight);
  allocate(); resizeCanvas(PW, PH); styleCanvas();
  if(ready) build();
}
function draw(){
  if(!ready) return;
  if(needBuild){ needBuild = false; build(); }

  // the lamp trails the cursor
  const dx = lampT.x - lampP.x, dy = lampT.y - lampP.y;
  if(Math.abs(dx) > 0.2 || Math.abs(dy) > 0.2){
    lampP.x += dx*0.10; lampP.y += dy*0.10;
    lampMoving = 14;                    // frames of grace before the crisp pass
    needShade = true;
  }
  if(needShade){
    if(lampMoving > 0){
      shade(true); lampMoving--;
      needShade = true;          // stay hot — the full-resolution pass is still owed
    } else {
      shade(false); needShade = false;
    }
  }
  const g = drawingContext;
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.clearRect(0,0,PW,PH);
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  if(lampMoving > 0 && lo) g.drawImage(lo.cv, 0, 0, PW, PH);
  else g.drawImage(artCv, 0, 0);
  if(selected >= 0 && items[selected]){
    const it = items[selected];
    g.save();
    g.strokeStyle = 'rgba(47,42,36,0.28)'; g.lineWidth = SS; g.setLineDash([3*SS,4*SS]);
    g.strokeRect((it.x - CELL_W/2 + 14)*SS, (it.y - CELL_H/2 + 14)*SS, (CELL_W - 28)*SS, (CELL_H - 28)*SS);
    g.restore();
  }
  if(grainPat && L.grain > 0){
    g.save();
    g.globalCompositeOperation = 'overlay';
    g.globalAlpha = L.grain;
    g.fillStyle = grainPat; g.fillRect(0,0,PW,PH);
    g.restore();
  }
  g.globalCompositeOperation = 'source-over';
}

function mxCSS(){ return mouseX/SS; }
function myCSS(){ return mouseY/SS; }
function cellAt(x, y){
  for(let i=0;i<items.length;i++){
    const it = items[i];
    if(Math.abs(x - it.x) < CELL_W/2 && Math.abs(y - it.y) < CELL_H/2) return i;
  }
  return -1;
}
function overStage(){
  if(mouseX < 0 || mouseY < 0 || mouseX > PW || mouseY > PH) return false;
  const el = document.elementFromPoint(winMouseX, winMouseY);   // viewport coords
  return !el || el.tagName === 'CANVAS' || el.id === 'stage' ||
         el.id === 'labels' || el.id === 'sheet' || el.className === 'cap';
}
function mouseMoved(){
  if(mouseX >= 0 && mouseY >= 0 && mouseX <= PW && mouseY <= PH){
    lampT.x = mxCSS(); lampT.y = myCSS();
  }
}
function mouseDragged(){ mouseMoved(); }
function mousePressed(){
  if(!ready || !overStage()) return;
  const hit = cellAt(mxCSS(), myCSS());
  if(hit >= 0){ selected = hit; showInspector(); }
  else deselect();
  return false;
}
function doubleClicked(){
  if(!ready || !overStage()) return;
  const hit = cellAt(mxCSS(), myCSS());
  if(hit >= 0){ selected = hit; openStudy(); }
  return false;
}
function keyPressed(){
  const t = document.activeElement && document.activeElement.tagName;
  if(t === 'TEXTAREA' || t === 'INPUT') return;
  if(keyCode === ESCAPE) deselect();
  if((keyCode === BACKSPACE || keyCode === DELETE) && selected >= 0) removeSel();
}

// ── labels ─────────────────────────────────────────────────────
function renderLabels(){
  const host = document.getElementById('labels');
  host.innerHTML = '';
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'cap' + (i === selected ? ' sel' : '');
    d.style.left = it.x + 'px';
    d.style.top = (it.y + CELL_H/2 - 12) + 'px';
    const form = it.form === 'seal' ? 'seal' : (it.form === 'bloom' ? 'bloom' :
                 (it.form === 'exlibris' ? 'bookplate' :
                 'card, ' + (it.content === 'flower' ? 'flower' : 'monogram')));
    const med = it.medium || 'relief';
    const head = med === 'relief' ? Matter.get(it.material).name : MEDIUM_LABEL[med];
    d.innerHTML = '<b>' + head + '</b><i>' + form + '</i>' +
                  (it.note ? '<u>' + it.note.replace(/[<>&]/g,'') + '</u>' : '');
    host.appendChild(d);
  });
}

// ── inspector ──────────────────────────────────────────────────
function buildChips(){
  const mat = document.getElementById('i-mat');
  Matter.NAMES.forEach(k => {
    const b = document.createElement('button');
    b.textContent = Matter.get(k).name.split(' ')[0];
    b.onclick = () => setField('material', k);
    b.dataset.v = k; mat.appendChild(b);
  });
  const md = document.getElementById('i-medium');
  MEDIA.forEach(k => {
    const b = document.createElement('button');
    b.textContent = MEDIUM_LABEL[k]; b.dataset.v = k;
    b.onclick = () => setField('medium', k);
    md.appendChild(b);
  });
  const fm = document.getElementById('i-form');
  FORMS.forEach(k => {
    const b = document.createElement('button');
    b.textContent = k; b.dataset.v = k;
    b.onclick = () => setField('form', k);
    fm.appendChild(b);
  });
  const ct = document.getElementById('i-content');
  CONTENTS.forEach(k => {
    const b = document.createElement('button');
    b.textContent = k === 'die' ? 'Monogram' : 'Flower'; b.dataset.v = k;
    b.onclick = () => setField('content', k);
    ct.appendChild(b);
  });
}
function showInspector(){
  const it = items[selected]; if(!it) return;
  document.getElementById('inspector').style.display = 'block';
  document.getElementById('i-title').textContent = Matter.get(it.material).name;
  document.querySelectorAll('#i-mat button').forEach(b => b.classList.toggle('on', b.dataset.v === it.material));
  document.querySelectorAll('#i-form button').forEach(b => b.classList.toggle('on', b.dataset.v === it.form));
  document.querySelectorAll('#i-medium button').forEach(b => b.classList.toggle('on', b.dataset.v === (it.medium||'relief')));
  const printed = (it.medium||'relief') !== 'relief';
  document.getElementById('row-ink').style.display = (printed && it.medium !== 'pencil') ? 'block' : 'none';
  document.getElementById('row-name').style.display = it.form === 'exlibris' ? 'block' : 'none';
  document.getElementById('i-ink1').value = it.ink1 || '#2b2a30';
  document.getElementById('i-ink2').value = it.ink2 || '#a8443a';
  document.getElementById('i-name').value = it.name || 'KYRA MO';
  document.querySelectorAll('#i-content button').forEach(b => b.classList.toggle('on', b.dataset.v === it.content));
  document.getElementById('row-content').style.display = it.form === 'card' ? 'block' : 'none';
  document.getElementById('i-scale').value = it.scale;
  document.getElementById('v-scale').textContent = (+it.scale).toFixed(2);
  document.getElementById('i-depth').value = it.depth;
  document.getElementById('v-depth').textContent = (+it.depth).toFixed(2);
  document.getElementById('i-note').value = it.note || '';
  renderLabels();
}
function deselect(){ selected = -1; document.getElementById('inspector').style.display = 'none'; renderLabels(); }
function setField(k, v){
  const it = items[selected]; if(!it) return;
  it[k] = v;
  const el = document.getElementById('v-'+k);
  if(el) el.textContent = (+v).toFixed(2);
  persist();
  if(k === 'note'){ renderLabels(); return; }
  needBuild = true; showInspector();
}
function reseedSel(){
  const it = items[selected]; if(!it) return;
  it.seed = Math.floor(Math.random()*999999)+1;
  it.species = Flora.NAMES[Math.floor(Math.random()*Flora.NAMES.length)];
  needBuild = true; persist();
}
function removeSel(){
  if(selected < 0) return;
  items.splice(selected,1); deselect();
  needBuild = true; persist();
}
function openStudy(){
  const it = items[selected]; if(!it) return;
  persist();
  const kind = (it.form === 'bloom' || (it.form === 'card' && it.content === 'flower')) ? 'flower' : 'press';
  const M = Matter.get(it.material);
  // carry the sheet's conditions across so the study opens looking like the
  // clipping it came from, not like the study's own defaults
  const conditions = {
    surface: 'ink', finish: 'matte', cSheet: GROUND, color: M.color,
    lampColor: '#fffaf2', lightHeight: L.h, lightSize: 1400,
    grainAmt: L.grain, contrast: 0.94, steps: 0,
    toneShadow: '#2b2721', toneHigh: '#ffffff', toneAmt: 0.10,
    substrate: SHAPE_OF[it.material] || 'wax'
  };
  location.href = Hub.linkTo(kind, specFor(it), {from: 'clippings', conditions: conditions});
}

// ── sheet ──────────────────────────────────────────────────────
function addPressing(){
  items.push(newPressing());
  selected = items.length - 1;
  needBuild = true; persist();
  setTimeout(showInspector, 0);
}
function fillSet(){
  // one of everything worth comparing
  items = [];
  const set = [
    {material:'wax',     form:'seal',     medium:'relief'},
    {material:'clay',    form:'seal',     medium:'relief'},
    {material:'brass',   form:'bloom',    medium:'relief'},
    {material:'paper',   form:'card',     medium:'relief', content:'flower'},
    {material:'paper',   form:'exlibris', medium:'ink'},
    {material:'paper',   form:'seal',     medium:'twotone'},
    {material:'paper',   form:'bloom',    medium:'pencil'},
    {material:'plaster', form:'bloom',    medium:'relief'},
    {material:'slate',   form:'seal',     medium:'relief'},
    {material:'vellum',  form:'card',     medium:'relief', content:'die'},
    {material:'pewter',  form:'seal',     medium:'relief'},
    {material:'paper',   form:'exlibris', medium:'twotone'}
  ];
  set.forEach(o => items.push(newPressing(o)));
  deselect(); needBuild = true; persist();
}
function shuffleAll(){
  items.forEach(it => {
    it.seed = Math.floor(Math.random()*999999)+1;
    it.species = Flora.NAMES[Math.floor(Math.random()*Flora.NAMES.length)];
    it.die = ['monogram','crest','figure'][Math.floor(Math.random()*3)];
  });
  needBuild = true; persist();
}
function clearAll(){ items = []; deselect(); needBuild = true; persist(); }
function downloadPNG(){ saveCanvas('clippings', 'png'); }
function togglePanel(id){
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
function showLight(k, v){
  const idm = {h:'v-lightHeight', grain:'v-grainAmt'};
  const el = document.getElementById(idm[k]);
  if(el) el.textContent = v < 2 ? (+v).toFixed(2) : (+v).toFixed(0);
}
function setLight(k, v){
  L[k === 'ang' ? 'ang' : (k === 'h' ? 'h' : 'grain')] = v;
  const idm = {h:'v-lightHeight', grain:'v-grainAmt'};
  const el = document.getElementById(idm[k]);
  if(el) el.textContent = v < 2 ? (+v).toFixed(2) : (+v).toFixed(0);
  needShade = true; persist();
}
function setSheetNote(v){ sheetNote = v; persist(); }
function syncUI(){
  document.getElementById('sheet-note').value = sheetNote;
  document.getElementById('s-lightHeight').value = L.h;
  document.getElementById('v-lightHeight').textContent = L.h;
  document.getElementById('s-grainAmt').value = L.grain;
  document.getElementById('v-grainAmt').textContent = (+L.grain).toFixed(2);
}

// ── notes out ──────────────────────────────────────────────────
function copyNotes(){
  let md = '## Clippings notes\n\n';
  if(sheetNote) md += sheetNote.trim() + '\n\n';
  items.forEach(it => {
    if(!it.note) return;
    const form = it.form === 'card' ? 'card with ' + it.content : it.form;
    const med = MEDIUM_LABEL[it.medium || 'relief'];
    md += '- **' + med + ', ' + Matter.get(it.material).name + ', ' + form + '** (seed ' + it.seed +
          ', scale ' + it.scale + ', impression ' + it.depth + ') — ' + it.note.trim() + '\n';
  });
  if(md.trim() === '## Clippings notes') md += '_nothing written yet_\n';
  if(navigator.clipboard) navigator.clipboard.writeText(md).catch(() => {});
  document.getElementById('sheet-note').value = md;
}
function copyState(){
  const txt = JSON.stringify(stateObj());
  if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  document.getElementById('sheet-note').value = txt;
}
function stateObj(){
  return {v:1, light:L, sheetNote: sheetNote, items: items.map(it => {
    const o = {}; Object.keys(it).forEach(k => { if(k !== '_parts') o[k] = it[k]; }); return o;
  })};
}
function persist(){ try { localStorage.setItem(STORE, JSON.stringify(stateObj())); } catch(e){} }
function restore(){
  try {
    const raw = localStorage.getItem(STORE);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(o.light) Object.assign(L, o.light);
    sheetNote = o.sheetNote || '';
    items = o.items || [];
  } catch(e){}
}
</script>
