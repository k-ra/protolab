:root{--ink:#2f2a24;--soft:#6a645b;--sheet:#efece4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--sheet);color:var(--ink);font-family:'Poppins',sans-serif;font-weight:300;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* each slip has an invisible hand-hold laid exactly over it */
#slips a{position:absolute;left:0;top:0;display:block;border-radius:3px;
  -webkit-tap-highlight-color:transparent;outline:none;touch-action:none;
  -webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
body.holding,body.holding #slips a{cursor:grabbing}
#slips a:focus-visible{outline:1px dashed var(--soft);outline-offset:11px}
#slips a.round{border-radius:50%}
/* the name is pencilled on the sheet beneath the slip, and only when you come close */
#slips a span{position:absolute;left:50%;top:100%;margin-top:14px;transform:translateX(-50%);
  font-family:'Lora',serif;font-style:italic;font-size:13px;line-height:1;color:var(--soft);
  white-space:nowrap;opacity:0;transition:opacity .5s ease;pointer-events:none}
#slips a.near span,#slips a:focus-visible span{opacity:1}
#slips a.piled span{opacity:0}
#slips a.piled:hover span,#slips a.piled:focus-visible span{opacity:1}
@media (hover:none){#slips a span{opacity:.9}#slips a.piled span{opacity:0}}
@media (prefers-reduced-motion:reduce){#slips a span{transition:none}}

noscript{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;
  font-family:'Lora',serif;font-style:italic;font-size:15px}
noscript a{color:var(--soft)}

<script>
// ═══════════════════════════════════════════════════════════════
// The cover — one sheet of paper, with clippings resting on it.
//
// Nothing here is a picture. The wordmark is a blind deboss in the sheet's
// height field; every slip is a real pressing from the clippings pipeline,
// cut from its own stock and lit by the same lamp. The lamp is the sun:
// it rises on arrival to rake the deboss into view, and leans a little
// toward the cursor. A canopy somewhere overhead lets its shade drift over
// everything.
//
// The slips are the way in. They answer in paper's vocabulary: come near and
// one lifts on a breath of air, hover and it rises off the sheet, press and
// it is picked up.
// ═══════════════════════════════════════════════════════════════

const SHEET = '#efece4';
const MAP = new Image();
MAP.src = 'twin-peaks/clipping.jpg';
// if the map arrives after the sheet was laid, cut its clipping then
MAP.addEventListener('load', () => {
  const s = ready && slips.find(q => q.k === 'map');
  if(s){ buildSlip(s); shadeSlip(s); }
});
const STOCK = {cotton:'#fbfaf7', sheet:'#efece4', vellum:'#e4dcc6', amber:'#aa7942'};
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SEED = Math.floor(Math.random()*99999) + 1;
const PIXEL_BUDGET = 5e6;

// one lamp for everything — the shading below and the pool on the sheet use
// the same numbers, so a slip and the paper beneath it always agree
const LAMP = {h: 980, radius: 3200, color: '#fff8ee', amb: 0.58, wrap: 0.42};
const PAPER_RESPONSE = {ambient: LAMP.amb, aoLo: 0.62, exposure: 1.0, gloss: 0, sheen: 0.02, scatter: 0.02, env: false};
const GOLD_RESPONSE = {ambient: 0.22, aoLo: 0.35, exposure: 1.3, gloss: 0.78, sheen: 0.16, scatter: 0, env: true, envLo: 0.35, envHi: 1.75};
const BLUEPRINT = {shadow: '#002e7a', high: '#ffffff', amount: 1};

let DW, DH, SS, PW, PH;
let paperCv, poolCv, poolCtx, bgCv, bgCtx, grainPat, canopyCv;
let wm = null;                 // the debossed wordmark
let slips = [];
let lamp = {x: 0, y: 0, h: LAMP.h}, lampT = {x: 0, y: 0, h: LAMP.h}, lastLit = null;
let pointer = null, held = null;
let ready = false, settled = true, t0 = 0, boot = null, waiting = false;

// ── stock and silhouettes ──────────────────────────────────────
// a small sheet, softly deckled — the same edge the clippings sheet cuts
function deckle(ctx, w, h, seed, rough){
  const rng = Relief.makeRng(seed);
  const ph = [rng()*6.28, rng()*6.28, rng()*6.28];
  const k = Math.min(w, h)*(rough || 0.022);
  ctx.beginPath();
  for(let i=0;i<=220;i++){
    const per = i/220*4;
    let x, y, nx, ny;
    if(per < 1){ x = -w + 2*w*per; y = -h; nx = 0; ny = -1; }
    else if(per < 2){ x = w; y = -h + 2*h*(per-1); nx = 1; ny = 0; }
    else if(per < 3){ x = w - 2*w*(per-2); y = h; nx = 0; ny = 1; }
    else { x = -w; y = h - 2*h*(per-3); nx = -1; ny = 0; }
    const n = (Math.sin(per*6.7+ph[0])*0.5 + Math.sin(per*15.1+ph[1])*0.3 + Math.sin(per*29.3+ph[2])*0.2)*k;
    if(i === 0) ctx.moveTo(x+nx*n, y+ny*n); else ctx.lineTo(x+nx*n, y+ny*n);
  }
  ctx.closePath();
}

// a disc, cut by hand: never quite round
function disc(ctx, r, seed){
  const rng = Relief.makeRng(seed);
  const ph = [rng()*6.28, rng()*6.28, rng()*6.28];
  ctx.beginPath();
  for(let i=0;i<=240;i++){
    const a = i/240*Math.PI*2;
    const n = (Math.sin(a*3+ph[0])*0.5 + Math.sin(a*11+ph[1])*0.3 + Math.sin(a*27+ph[2])*0.2)*r*0.012;
    const x = Math.cos(a)*(r + n), y = Math.sin(a)*(r + n);
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function outline(ctx, s){
  if(s.round){ disc(ctx, s.hw, s.seed); return; }
  deckle(ctx, s.hw, s.hh, s.seed, s.rough);
  if(s.hole){                           // a punched tag: the hole shows the sheet
    ctx.moveTo(s.hole.x + s.hole.r, s.hole.y);
    ctx.arc(s.hole.x, s.hole.y, s.hole.r, 0, Math.PI*2, true);
  }
}

// a bookplate — the clippings sheet's ex libris
function exlibris(ctx, R, seed){
  const w = R*0.86, h = R*1.12;
  ctx.lineJoin = 'miter';
  ctx.lineWidth = R*0.030; ctx.strokeRect(-w, -h, w*2, h*2);
  ctx.lineWidth = R*0.012; ctx.strokeRect(-w*0.90, -h*0.92, w*1.80, h*1.84);
  ctx.save(); ctx.translate(0, -h*0.36); Dies.tracked(ctx, 'EX LIBRIS', 0, R*0.115, 0.42, '500'); ctx.restore();
  ctx.save(); ctx.translate(0, h*0.04); Dies.crest(ctx, R*0.40, Relief.makeRng(seed), 7); ctx.restore();
  ctx.save(); ctx.translate(0, h*0.58);
  ctx.lineWidth = R*0.010;
  ctx.beginPath(); ctx.moveTo(-w*0.62, -R*0.11); ctx.lineTo(w*0.62, -R*0.11); ctx.stroke();
  Dies.tracked(ctx, 'KYRA MO', R*0.10, R*0.082, 0.34, '400');
  ctx.restore();
}

// ── what each slip carries ────────────────────────────────────
// Heights are grey levels: the slip itself sits at mid grey, a pressing
// raises (white) or sinks (black) it. Drawn at partial alpha, so it modulates
// the stock instead of replacing it — exactly how the clippings cards work.
const BASE = 0.5;
const grey = v => { const c = Math.round(Math.max(0, Math.min(1, v))*255); return 'rgb('+c+','+c+','+c+')'; };

const KINDS = {
  // the sheet, in miniature: a blind aster, its slopes stepped like the map's
  sheet: {
    stock: STOCK.sheet, terrace: 0.075,
    height(ctx, s){
      const f = s.flower;
      ctx.globalAlpha = 0.8; Flora.render(ctx, f.parts, f.spec, 'h');
    }
  },
  // a botanical plate on vellum, painted the way the round map is painted
  specimen: {
    stock: STOCK.vellum,
    height(){},
    paint: paintPlate
  },
  // letterpress: a platemark and a debossed monogram
  press: {
    stock: STOCK.cotton,
    height(ctx, s){
      const U = s.U;
      ctx.fillStyle = grey(BASE - 0.17);                 // where the plate landed
      ctx.fillRect(-s.hw*0.74, -s.hh*0.78, s.hw*1.48, s.hh*1.56);
      ctx.fillStyle = ctx.strokeStyle = grey(BASE - 0.40);
      Dies.ring(ctx, U*0.50, U*0.016);
      Dies.monogram(ctx, U*0.34, 'K');
    }
  },
  // a Blueprint ex libris: deep blue and white on amber, one band
  clippings: {
    stock: STOCK.amber, tone: true,
    height(ctx, s){
      ctx.globalAlpha = 0.55; ctx.fillStyle = ctx.strokeStyle = '#fff';
      exlibris(ctx, s.U*0.62, s.seed);
    },
    ink(ctx, s){ ctx.fillStyle = ctx.strokeStyle = '#fff'; exlibris(ctx, s.U*0.62, s.seed); }
  },
  // a round clipping cut from the map — printed, so it lies flat in the light
  map: {
    stock: STOCK.cotton,
    height(){},
    color(ctx, s){
      if(!MAP.complete || !MAP.naturalWidth) return;
      ctx.save();
      disc(ctx, s.hw*0.97, s.seed); ctx.clip();
      const d = s.hw*2*1.04;
      ctx.drawImage(MAP, -d/2, -d/2, d, d);
      ctx.restore();
    }
  },
  // a graphite rubbing taken off the stele: the cut signs stay paper-white
  rubbing: {
    stock: '#ece9e1',
    height(){},
    color(ctx, s){
      const U = s.U, w = s.hw*0.80, h = s.hh*0.74, rng = Relief.makeRng(s.seed + 5);
      ctx.save();
      ctx.beginPath();                                   // the stone's edge, broken at the top left
      ctx.moveTo(-w, -h*0.35); ctx.lineTo(-w*0.2, -h); ctx.lineTo(w, -h); ctx.lineTo(w, h); ctx.lineTo(-w, h); ctx.closePath();
      ctx.clip();
      ctx.strokeStyle = 'rgba(66,66,72,0.30)'; ctx.lineWidth = Math.max(0.5, U*0.008);
      for(let i=0;i<1400;i++){                           // the pencil, worked on the diagonal
        const x = -w*1.1 + rng()*2.2*w, y = -h*1.1 + rng()*2.2*h, l = U*(0.03 + rng()*0.05);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + l, y - l*0.6); ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = ctx.fillStyle = '#ece9e1'; ctx.lineWidth = Math.max(1, U*0.026); ctx.lineCap = 'round';
      const q = U*0.10;
      for(let row=0; row<5; row++){
        const y = -h*0.55 + row*q*1.5;
        for(let x = -w*0.82 + (row === 0 ? w*0.5 : 0); x < w*0.8; x += q*1.3){
          const k = Math.floor(rng()*4);
          ctx.beginPath();
          if(k === 0) ctx.arc(x, y, q*0.32, 0, 7);
          else if(k === 1){ for(let j=0;j<=4;j++) ctx.lineTo(x - q*0.4 + j*q*0.2, y + (j % 2 ? -q*0.12 : q*0.12)); }
          else if(k === 2){ ctx.moveTo(x, y + q*0.4); ctx.lineTo(x, y - q*0.4); ctx.moveTo(x, y - q*0.1); ctx.lineTo(x + q*0.25, y - q*0.35); }
          else { ctx.moveTo(x - q*0.4, y + q*0.2); ctx.quadraticCurveTo(x, y - q*0.4, x + q*0.4, y + q*0.2); }
          ctx.stroke();
        }
      }
    }
  },
  // a scrap of marbled paper, computed the way the ebru study computes it
  marbled: {
    stock: '#e8dcc0',
    height(){},
    color(ctx, s){
      const rng = Relief.makeRng(s.seed + 8), films = [];
      const inks = ['#2c3e63', '#c99a45', '#b2524a', '#6e2a2a', '#4f7d68', '#ece3cf'];
      const drop = (cx, cy, r, c) => {
        films.forEach(f => { for(let i=0;i<f.p.length;i+=2){ const dx = f.p[i] - cx, dy = f.p[i+1] - cy, k = Math.sqrt(1 + r*r/(dx*dx + dy*dy || 1e-6)); f.p[i] = cx + dx*k; f.p[i+1] = cy + dy*k; } });
        const p = []; for(let i=0;i<120;i++){ const a = i/120*6.283; p.push(cx + Math.cos(a)*r, cy + Math.sin(a)*r); }
        films.push({p, c});
      };
      for(let i=0;i<70;i++) drop((rng()*2 - 1)*s.hw, (rng()*2 - 1)*s.hh, s.U*(0.05 + rng()*0.06), inks[(i*5 + (rng()*2|0)) % inks.length]);
      const tine = (x0, shift, sharp) => films.forEach(f => { for(let i=0;i<f.p.length;i+=2){ const d = Math.abs(f.p[i] - x0); f.p[i+1] += shift*sharp/(d + sharp); } });
      for(let t=0;t<9;t++) tine(-s.hw + (t + 0.5)*s.hw*2/9, (t % 2 ? -1 : 1)*s.U*0.16, s.U*0.05);
      ctx.save(); outline(ctx, s); ctx.clip();
      films.forEach(f => { ctx.beginPath(); for(let i=0;i<f.p.length;i+=2) ctx.lineTo(f.p[i], f.p[i+1]); ctx.closePath(); ctx.fillStyle = f.c; ctx.fill(); });
      ctx.restore();
    }
  },
  // a sun print: prussian blue, the shadow of a frond left white
  cyan: {
    stock: STOCK.cotton,
    height(){},
    color(ctx, s){
      const rng = Relief.makeRng(s.seed + 2);
      ctx.save(); ctx.fillStyle = '#1f3d72';
      deckle(ctx, s.hw*0.84, s.hh*0.86, s.seed + 9, 0.05); ctx.fill();
      ctx.strokeStyle = '#f4f0e5'; ctx.lineCap = 'round';
      const frond = (x, y, a, len, w, d) => {
        const nx = x + Math.cos(a)*len, ny = y + Math.sin(a)*len;
        ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a + 0.3)*len*0.5, y + Math.sin(a + 0.3)*len*0.5, nx, ny); ctx.stroke();
        if(d > 5 || w < 0.5) return;
        frond(nx, ny, a - 0.35 - rng()*0.2, len*0.78, w*0.74, d + 1);
        frond(nx, ny, a + 0.35 + rng()*0.2, len*0.78, w*0.74, d + 1);
      };
      frond(0, s.hh*0.62, -Math.PI/2, s.hh*0.30, s.U*0.05, 0);
      ctx.lineWidth = Math.max(0.6, s.U*0.012);
      ctx.beginPath(); ctx.moveTo(-s.hw*0.35, s.hh*0.76); ctx.lineTo(s.hw*0.35, s.hh*0.76); ctx.stroke();
      ctx.restore();
    }
  },
  // a leaf of vellum with a raised gold initial on lapis
  gilded: {
    stock: '#efe5cf', gold: true,
    height(ctx, s){
      ctx.save(); ctx.translate(0, -s.hh*0.18);
      ctx.globalAlpha = 0.85; ctx.fillStyle = '#fff';
      ctx.font = '600 ' + (s.U*0.78) + 'px Lora, Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('P', 0, s.U*0.03);
      ctx.lineWidth = s.U*0.03; ctx.strokeStyle = '#fff'; ctx.strokeRect(-s.U*0.48, -s.U*0.48, s.U*0.96, s.U*0.96);
      ctx.restore();
    },
    color(ctx, s){
      ctx.save(); ctx.translate(0, -s.hh*0.18);
      ctx.fillStyle = '#26458a'; ctx.fillRect(-s.U*0.46, -s.U*0.46, s.U*0.92, s.U*0.92);
      KINDS.gilded.mask(ctx, s, '#caa04a');
      ctx.restore();
      ctx.fillStyle = 'rgba(74,53,38,0.75)';                 // a few lines of text below
      for(let l=0;l<4;l++) for(let x=-s.hw*0.66; x<s.hw*0.66; x+=s.U*0.05) if((x*7 + l*3) % 5 > 0.8) ctx.fillRect(x, s.hh*0.42 + l*s.U*0.11, s.U*0.018, s.U*0.05);
    },
    mask(ctx, s, col){
      ctx.save(); if(!col) ctx.translate(0, -s.hh*0.18);
      ctx.fillStyle = ctx.strokeStyle = col || '#fff';
      ctx.font = '600 ' + (s.U*0.78) + 'px Lora, Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('P', 0, s.U*0.03);
      ctx.lineWidth = s.U*0.03; ctx.strokeRect(-s.U*0.48, -s.U*0.48, s.U*0.96, s.U*0.96);
      ctx.restore();
    }
  },
  // one line, spiralling out, swelling where a flower is dark
  engraving: {
    stock: '#f6f2e7',
    height(ctx, s){
      ctx.fillStyle = grey(BASE - 0.12);
      ctx.fillRect(-s.hw*0.78, -s.hh*0.80, s.hw*1.56, s.hw*1.56);
    },
    color(ctx, s){
      const R = s.hw*0.70, cy = -s.hh*0.80 + s.hw*0.78, gap = Math.max(1.0, R/30);
      const L = [], Rt = [];
      for(let th=0; ; ){
        const r = gap*th/6.283; if(r > R) break;
        const a = th % 6.283, rr = R*0.78*(0.5 + 0.5*Math.abs(Math.cos(a*3.5)));
        const dark = r < rr ? 0.25 + 0.6*(r/rr) : 0.03;
        const w = gap*(0.06 + 0.86*dark), nx = Math.cos(th), ny = Math.sin(th);
        const x = nx*r, y = cy + ny*r;
        L.push(x + nx*w/2, y + ny*w/2); Rt.push(x - nx*w/2, y - ny*w/2);
        th += Math.min(0.6, 0.9/Math.max(r, 1));
      }
      ctx.beginPath(); ctx.moveTo(L[0], L[1]);
      for(let i=2;i<L.length;i+=2) ctx.lineTo(L[i], L[i+1]);
      for(let i=Rt.length - 2;i>=0;i-=2) ctx.lineTo(Rt[i], Rt[i+1]);
      ctx.closePath(); ctx.fillStyle = '#211b18'; ctx.fill();
    }
  },
  // washi torn across and mended with a raised seam of gold
  washi: {
    stock: '#f3eee2', gold: true,
    tear(ctx, s){
      const rng = Relief.makeRng(s.seed + 4);
      ctx.beginPath(); ctx.moveTo(-s.hw*1.05, -s.hh*0.2);
      for(let i=1;i<=24;i++){ const t = i/24; ctx.lineTo(-s.hw*1.05 + t*s.hw*2.1, -s.hh*0.2 + t*s.hh*0.5 + (rng() - 0.5)*s.hh*0.16); }
    },
    height(ctx, s){ ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.6; ctx.lineWidth = s.U*0.05; ctx.lineJoin = 'round'; KINDS.washi.tear(ctx, s); ctx.stroke(); },

      for(let i=0;i<60;i++){ const x = (rng()*2 - 1)*s.hw, y = (rng()*2 - 1)*s.hh, a = rng()*6.28, l = s.U*(0.1 + rng()*0.25);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a + 0.5)*l*0.5, y + Math.sin(a + 0.5)*l*0.5, x + Math.cos(a)*l, y + Math.sin(a)*l); ctx.stroke(); }

// ── the specimen plate ────────────────────────────────────────
// A bloom, a bud on a side stem, veined leaves and a red seal, laid out once
// per slip and then drawn three ways: as height, as masks, as nothing else —
// colour comes from Gouache, the way the map gets it.
function layoutPlate(s){
  const U = s.U, rng = Relief.makeRng(s.seed + 11);
  const side = rng() < 0.5 ? -1 : 1;
  const fy = -s.hh*0.30, foot = s.hh*0.90;
  const bend = side*U*(0.10 + rng()*0.12);
  const main = [[0, fy], [bend*0.15, fy + (foot - fy)*0.35], [bend, fy + (foot - fy)*0.70], [bend*0.6, foot]];
  const at = t => {                               // a point on the main stem
    const [p0, p1, p2, p3] = main, u = 1 - t;
    return [u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0],
            u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]];
  };
  const b0 = at(0.42);
  const bud = {x: -side*U*0.68, y: fy + U*0.50, r: U*0.12, a: -side*0.45};
  const branch = [b0, [b0[0] - side*U*0.10, b0[1] - U*0.30], [bud.x + side*U*0.10, bud.y + U*0.32], [bud.x, bud.y + bud.r*0.9]];
  const leaves = [[0.30, side], [0.56, -side], [0.76, side]].map(([t, sd]) => {
    const p = at(t);
    return {x: p[0], y: p[1], a: sd*(1.0 + rng()*0.35), L: U*(0.50 + rng()*0.16)};
  });
  const sepals = [-1, 1].map(sd => ({x: bud.x, y: bud.y + bud.r*0.7, a: bud.a + sd*0.55, L: bud.r*1.15}));
  const seal = {x: s.hw*0.66, y: s.hh*0.80, r: U*0.065};
  return {fy, main, branch, bud, leaves, sepals, seal};
}

function leafPath(ctx, L, w){
  const W = L.L*0.28*w;
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(W*1.1, -L.L*0.18, W*0.9, -L.L*0.72, 0, -L.L);
  ctx.bezierCurveTo(-W*0.8, -L.L*0.70, -W*1.0, -L.L*0.20, 0, 0);
  ctx.closePath();
}
function budPath(ctx, b, w){
  const r = b.r;
  ctx.beginPath();
  ctx.moveTo(0, r);
  ctx.bezierCurveTo(r*1.05*w, r*0.8, r*0.95*w, -r*0.6, 0, -r*1.5);
  ctx.bezierCurveTo(-r*0.95*w, -r*0.6, -r*1.05*w, r*0.8, 0, r);
  ctx.closePath();
}
function stemPath(ctx, c){
  ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]);
  ctx.bezierCurveTo(c[1][0], c[1][1], c[2][0], c[2][1], c[3][0], c[3][1]);
}

// the green parts. For height, each leaf is cut as a stack of narrower
// copies of itself, so its slope comes out as terraces — the map's contours.
function plateGreens(ctx, s, P, mode){
  const U = s.U, H = mode === 'h';
  ctx.lineCap = 'round';
  [P.main, P.branch].forEach((c, k) => {
    ctx.strokeStyle = H ? grey(0.30) : '#fff'; ctx.lineWidth = U*(k ? 0.024 : 0.034);
    stemPath(ctx, c); ctx.stroke();
    if(H){ ctx.strokeStyle = grey(0.38); ctx.lineWidth = U*0.010; stemPath(ctx, c); ctx.stroke(); }
  });
  P.leaves.concat(P.sepals).forEach(L => {
    ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(L.a);
    if(!H){ ctx.fillStyle = '#fff'; leafPath(ctx, L, 1); ctx.fill(); ctx.restore(); return; }
    [[1, 0.18], [0.74, 0.25], [0.48, 0.32], [0.22, 0.39]].forEach(([w, v]) => {
      ctx.fillStyle = grey(v); leafPath(ctx, L, w); ctx.fill();
    });
    ctx.strokeStyle = grey(0.44); ctx.lineWidth = Math.max(0.6, L.L*0.022);   // midrib
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(L.L*0.03, -L.L*0.5, 0, -L.L*0.94); ctx.stroke();
    ctx.strokeStyle = grey(0.14); ctx.lineWidth = Math.max(0.5, L.L*0.012);   // veins, sunk
    for(let k=1;k<=4;k++){
      const y = -L.L*(0.16 + k*0.17), sp = L.L*0.20*(1 - k*0.16);
      [-1, 1].forEach(sd => { ctx.beginPath(); ctx.moveTo(0, y + L.L*0.04); ctx.quadraticCurveTo(sd*sp*0.6, y, sd*sp, y - L.L*0.09); ctx.stroke(); });
    }
    ctx.restore();
  });
}
function plateBud(ctx, s, P, mode){
  const b = P.bud;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a);
  if(mode === 'h'){
    [[1, 0.46], [0.72, 0.56], [0.44, 0.66], [0.18, 0.74]].forEach(([w, v]) => { ctx.fillStyle = grey(v); budPath(ctx, b, w); ctx.fill(); });
    ctx.strokeStyle = grey(0.36); ctx.lineWidth = Math.max(0.5, b.r*0.05);       // the furl
    ctx.beginPath(); ctx.moveTo(-b.r*0.1, b.r*0.6); ctx.quadraticCurveTo(b.r*0.45, -b.r*0.3, 0, -b.r*1.4); ctx.stroke();
  } else { ctx.fillStyle = '#fff'; budPath(ctx, b, 1); ctx.fill(); }
  ctx.restore();
}
function plateSeal(ctx, P){
  const q = P.seal, r = q.r;
  ctx.beginPath();
  ctx.rect(q.x - r, q.y - r, r*2, r*2);
  ctx.rect(q.x - r*0.74, q.y - r*0.74, r*1.48, r*1.48);
  ctx.rect(q.x - r*0.62, q.y - r*0.62, r*1.24, r*1.24);
  ctx.moveTo(q.x - r*0.08, q.y - r*0.45); ctx.rect(q.x - r*0.09, q.y - r*0.45, r*0.18, r*0.9);   // a single stroke, cut out
  ctx.fill('evenodd');
}

function paintPlate(F, s, at){
  const P = s.plate || (s.plate = layoutPlate(s));
  const f = s.flower;
  const petals = f.parts.filter(p => p.kind === 'petal');
  const heart  = f.parts.filter(p => p.kind === 'disc' || p.kind === 'floret');
  const inBloom = ctx => ctx.translate(0, P.fy);

  const h = F.rasterLuma(ctx => {
    at(ctx);
    plateGreens(ctx, s, P, 'h');
    plateBud(ctx, s, P, 'h');
    ctx.save(); inBloom(ctx); Flora.render(ctx, petals, f.spec, 'h'); Flora.render(ctx, heart, f.spec, 'h'); ctx.restore();
  });
  const greens = F.raster(ctx => { at(ctx); plateGreens(ctx, s, P, 'm'); });
  const blooms = F.raster(ctx => {
    at(ctx); plateBud(ctx, s, P, 'm');
    ctx.save(); inBloom(ctx); Flora.render(ctx, petals, f.spec, 'c'); ctx.restore();
  });
  const disc = F.raster(ctx => { at(ctx); inBloom(ctx); Flora.render(ctx, heart, f.spec, 'c'); });
  const seal = F.raster(ctx => { at(ctx); ctx.fillStyle = '#fff'; plateSeal(ctx, P); });

  const RA = Gouache.RAMPS;
  const colorMap = Gouache.paint({
    F, h, ss: SS, step: 0.08, relief: 30,
    ground: Relief.hexRgb(STOCK.vellum),
    shadow: {dx: s.U*0.035, dy: s.U*0.05, r: s.U*0.035},
    layers: [
      {mask: greens, ramp: RA.leaf, lo: 0.10, hi: 0.46},
      {mask: blooms, ramp: RA[s.wash], lo: 0.14, hi: 0.92},
      {mask: disc,   ramp: RA.straw, lo: 0.62, hi: 1.0},
      {mask: seal,   ramp: RA.seal,  lo: 0, hi: 1}
    ]
  });
  return {colorMap, h};
}

// ── composition ───────────────────────────────────────────────
// Not a grid that reflows. Each shape of window gets its own arrangement,
// re-rolled from the visit's seed — the slips look set down, not placed.
const LAYOUTS = {
  wide: {
    mark: {x: 0.50, y: 0.34},
    U: (w, h) => Math.min(w/1440, h/880)*108,
    pile: {x: 0.150, y: 0.72},
    slips: {
      sheet:     {x: 0.20, y: 0.30, r:  5, hw: 0.95, hh: 0.74},
      specimen:  {x: 0.35, y: 0.70, r: -4, hw: 1.06, hh: 1.36},
      press:     {x: 0.545, y: 0.74, r:  3, hw: 0.82, hh: 1.04},
      sigil:     {x: 0.695, y: 0.63, r: 11, hw: 0.56, hh: 0.86},
      clippings: {x: 0.815, y: 0.32, r: -7, hw: 0.70, hh: 0.92},
      map:       {x: 0.865, y: 0.74, r: 18, hw: 0.86, hh: 0.86}
    }
  },
  tall: {
    mark: {x: 0.50, y: 0.12},
    U: (w, h) => Math.min(w/430, h/900)*60,
    pile: {x: 0.70, y: 0.86},
    slips: {
      sheet:     {x: 0.75, y: 0.25, r:  7, hw: 0.95, hh: 0.74},
      specimen:  {x: 0.32, y: 0.33, r: -5, hw: 1.06, hh: 1.36},
      map:       {x: 0.72, y: 0.45, r: 16, hw: 0.80, hh: 0.80},
      press:     {x: 0.30, y: 0.56, r:  4, hw: 0.82, hh: 1.04},
      clippings: {x: 0.73, y: 0.64, r: -8, hw: 0.70, hh: 0.92},
      sigil:     {x: 0.30, y: 0.80, r: 12, hw: 0.56, hh: 0.86}
    }
  }
};
// the night's studies, gathered in one loose pile: sizes only, the pile places them
const PILED = {
  rubbing:   {hw: 0.80, hh: 0.60}, marbled:   {hw: 0.74, hh: 0.54}, cyan:    {hw: 0.62, hh: 0.82},
  gilded:    {hw: 0.58, hh: 0.80}, engraving: {hw: 0.62, hh: 0.72}, washi:   {hw: 0.56, hh: 0.50},
  girih:     {hw: 0.62, hh: 0.55}, smoked:    {hw: 1.35, hh: 0.32}, card:    {hw: 0.95, hh: 0.42},
  cabinet:   {hw: 0.55, hh: 0.78}, figures:   {hw: 0.70, hh: 0.70}, maze:    {hw: 0.66, hh: 0.56},
  seeds:     {hw: 0.62, hh: 0.62}, velvet:  {hw: 0.55, hh: 0.70}, tracing: {hw: 0.72, hh: 0.56},
  fern:      {hw: 0.52, hh: 0.76}, hand: {hw: 0.58, hh: 0.66}, quipu: {hw: 0.70, hh: 0.62}
};
// painter's order: later slips rest on earlier ones
// A new study gets a slip here, a kind above, and a place in both layouts.
const ORDER = ['sheet', 'specimen', 'press', 'clippings', 'sigil', 'map', 'rubbing', 'marbled', 'cyan', 'gilded', 'engraving', 'washi', 'girih', 'smoked', 'card', 'cabinet', 'figures', 'maze', 'seeds', 'velvet', 'tracing', 'fern', 'hand', 'quipu'];

function compose(){
  const L = DW/DH > 1.05 ? LAYOUTS.wide : LAYOUTS.tall;
  const U = Math.max(36, Math.min(150, L.U(DW, DH)));
  const rng = Relief.makeRng(SEED);
  const old = {};
  slips.forEach((s, z) => { old[s.k] = s; s.z = z; });
  slips = ORDER.map((k, i) => {
    // piled slips are dropped loosely on one spot, each a little turned
    const piled = !L.slips[k];
    const p = piled ? Object.assign({x: L.pile.x + (rng() - 0.5)*0.07, y: L.pile.y + (rng() - 0.5)*0.08, r: (rng() - 0.5)*44}, PILED[k]) : L.slips[k];
    const o = old[k] && old[k].placed ? old[k] : null;     // somewhere you put it stays put
    const s = {
      k, U, kind: KINDS[k],
      seed: SEED*7 + i*131,
      x: (p.x + (rng() - 0.5)*0.03)*DW,
      y: (p.y + (rng() - 0.5)*0.03)*DH,
      rot: (p.r + (rng() - 0.5)*5)*Math.PI/180,
      placed: o ? true : false, z: old[k] ? old[k].z : i, piled: piled && !o,
      hw: p.hw*U, hh: p.hh*U, rough: 0.02,
      el: document.querySelector('#slips a[data-k="'+k+'"]'),
      lift: old[k] ? old[k].lift : 60, liftT: 2, order: i
    };
    if(k === 'sigil') s.hole = {x: 0, y: -s.hh*0.70, r: U*0.055};
    if(k === 'map') s.round = true;
    if(k === 'sheet' || k === 'specimen'){
      const spec = Flora.defaults(k === 'specimen'
        ? {seed: s.seed, species: ['cosmos', 'anemone', 'poppy', 'scabiosa'][s.seed % 4], size: U*0.50, leaves: 0}
        : {seed: s.seed, species: 'aster', size: U*0.50, leaves: 0});
      s.flower = {spec, parts: Flora.grow(spec)};
      if(k === 'specimen') s.wash = ['rose', 'lav', 'coral'][Math.floor(s.seed/4) % 3];
    }
    if(k === 'sigil') s.seal = Press.defaults({seed: s.seed, substrate: 'wax', die: 'crest', size: U*0.42,
                                               color: Matter.get('wax').color, detail: 6, depth: 1});
    if(o){ s.x = o.fx*DW; s.y = o.fy*DH; s.rot = o.rot; }
    return s;
  });
  slips.sort((a, b) => a.z - b.z);
  markPile();
  wm = makeWordmark(L.mark.x*DW, L.mark.y*DH, U);
}


// ── one slip: rasterise once, relight when the lamp moves ─────
const PAD = 26;
function buildSlip(s){
  const W = Math.ceil((s.hw*2 + PAD*2)*SS), H = Math.ceil((s.hh*2 + PAD*2)*SS);
  const F = Relief.field(W, H);
  const at = ctx => ctx.setTransform(SS, 0, 0, SS, W/2, H/2);
  const K = s.kind;

  const cov = F.raster(ctx => { at(ctx); outline(ctx, s); ctx.fill('evenodd'); });
  const h0 = F.rasterLuma(ctx => {
    at(ctx);
    ctx.fillStyle = grey(BASE); outline(ctx, s); ctx.fill('evenodd');
    K.height(ctx, s);
  });
  // a painted slip brings its own colour, and a whisper of its height so the
  // paint sits in the paper rather than on it
  const painted = K.paint ? K.paint(F, s, at) : null;
  if(painted) for(let i=0;i<h0.length;i++) h0[i] += painted.h[i]*0.14*cov[i];
  // a terraced slip has its slopes stepped, the way the map steps its hills
  if(K.terrace) for(let i=0;i<h0.length;i++) h0[i] = Math.floor(h0[i]/K.terrace)*K.terrace;
  const col = painted ? {colorMap: painted.colorMap} : F.rasterColor(ctx => {
    at(ctx);
    ctx.fillStyle = K.stock; outline(ctx, s); ctx.fill('evenodd');
    if(K.color) K.color(ctx, s);
  });
  const wax = K.mask ? F.raster(ctx => { at(ctx); K.mask(ctx, s); }) : null;

  const sm = F.blur(h0, Math.max(1, Math.round(SS*0.8)), 2);
  const n2 = W*H, surf = new Float32Array(n2), hgt = new Float32Array(n2);
  const matMap = new Uint8Array(n2);
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const i = y*W + x;
      const a = cov[i];
      const isWax = wax && wax[i] > 0.5;
      matMap[i] = isWax ? 1 : 0;
      // the tooth of the stock, so flat paper still has a surface
      const tooth = (noise(x*0.11/SS + s.seed, y*0.11/SS) - 0.5)*(isWax ? 0.010 : 0.016);
      const rel = sm[i]*a;
      surf[i] = tooth + rel*0.62;
      // recesses collect a little shade
      hgt[i] = Math.min(1, 1 + (rel - BASE)*1.6);
    }
  }
  const nrm = F.normals(cov, surf, 46*SS);
  const materials = [PAPER_RESPONSE, K.gold ? GOLD_RESPONSE : Matter.response('wax')];

  s.F = F; s.W = W; s.H = H;
  s.shadeArgs = {cov, hgt, hMax: 1, nX: nrm.nX, nY: nrm.nY, nZ: nrm.nZ,
                 colorMap: col.colorMap, matMap, materials};
  s.cv = Relief.makeCanvas(W, H); s.ctx = s.cv.getContext('2d');

  // the Blueprint band only applies to what was printed, not to the amber
  if(K.tone){
    const ink = F.raster(ctx => { at(ctx); K.ink(ctx, s); });
    const spread = F.blur(ink, Math.max(1, Math.round(SS*1.2)), 2);
    const mc = Relief.makeCanvas(W, H), mctx = mc.getContext('2d');
    const img = mctx.createImageData(W, H);
    for(let i=0;i<n2;i++){ img.data[i*4+3] = Math.min(255, spread[i]*cov[i]*420); }
    mctx.putImageData(img, 0, 0);
    s.toneMask = mc;
    s.toneCv = Relief.makeCanvas(W, H); s.toneCtx = s.toneCv.getContext('2d');
  }

  // two shadows: a tight contact line, and a soft one that grows with lift
  s.shContact = Relief.makeCanvas(W, H); F.shadow(s.shContact.getContext('2d'), cov, 1.6*SS, 0.55);
  s.shSoft    = Relief.makeCanvas(W, H); F.shadow(s.shSoft.getContext('2d'), cov, 7*SS, 0.42);
}

// the lamp, carried into a slip's own unrotated frame
function localLamp(s){
  const dx = lamp.x - s.x, dy = lamp.y - s.y;
  const c = Math.cos(-s.rot), n = Math.sin(-s.rot);
  return {x: (dx*c - dy*n)*SS + s.W/2, y: (dx*n + dy*c)*SS + s.H/2,
          h: lamp.h*SS, radius: LAMP.radius*SS, color: LAMP.color};
}

function shadeSlip(s){
  const light = localLamp(s);
  const base = Object.assign({light, matte: true, wrap: LAMP.wrap, contrast: 0.96,
                              tone: {shadow: '#2b2721', high: '#ffffff', amount: 0.08}}, s.shadeArgs);
  s.F.shade(s.ctx, base);
  if(s.toneMask){
    s.F.shade(s.toneCtx, Object.assign({}, base, {steps: 1, contrast: 0.86, tone: BLUEPRINT}));
    s.toneCtx.globalCompositeOperation = 'destination-in';
    s.toneCtx.drawImage(s.toneMask, 0, 0);
    s.toneCtx.globalCompositeOperation = 'source-over';
    s.ctx.drawImage(s.toneCv, 0, 0);
  }
}

// ── the wordmark: a blind deboss in the sheet itself ───────────
// Lit as a difference from flat paper, so it has no edge of its own: where
// the sheet is level the overlay is exactly transparent.
function makeWordmark(cx, cy, U){
  const text = 'PROTOLAB';
  const size = Math.max(26, Math.min(72, U*0.50));
  const track = 0.34;
  const probe = Relief.makeCanvas(4, 4).getContext('2d');
  const tw = Dies.measureTracked(probe, text, size, track, '400');
  const W = Math.ceil((tw + 60)*SS), H = Math.ceil(size*2.4*SS);
  const F = Relief.field(W, H);
  const h0 = F.rasterLuma(ctx => {
    ctx.fillStyle = grey(0.5); ctx.fillRect(0, 0, W, H);
    ctx.setTransform(SS, 0, 0, SS, W/2, H/2);
    ctx.fillStyle = grey(0.0);
    Dies.tracked(ctx, text, size*0.04, size, track, '400');
  });
  const hs = F.blur(h0, Math.max(1, Math.round(SS*1.0)), 2);
  const n2 = W*H;
  const ones = new Float32Array(n2).fill(1);
  const nrm = F.normals(ones, hs, 6*SS);
  // only the pixels that aren't level need lighting
  const idx = [];
  for(let i=0;i<n2;i++) if(Math.abs(hs[i] - 0.5) > 0.004) idx.push(i);
  const cv = Relief.makeCanvas(W, H);
  return {cx, cy, W, H, nrm, hs, idx: Int32Array.from(idx), cv, ctx: cv.getContext('2d'),
          img: cv.getContext('2d').createImageData(W, H)};
}

function shadeWordmark(){
  const w = wm, d = w.img.data;
  const lx0 = (lamp.x - w.cx)*SS + w.W/2, ly0 = (lamp.y - w.cy)*SS + w.H/2, lh = lamp.h*SS;
  const {nX, nY, nZ} = w.nrm;
  for(let k=0;k<w.idx.length;k++){
    const i = w.idx[k], x = i % w.W, y = (i / w.W) | 0;
    const dx = lx0 - x, dy = ly0 - y;
    const inv = 1/Math.sqrt(dx*dx + dy*dy + lh*lh);
    const lx = dx*inv, ly = dy*inv, lz = lh*inv;
    let v = (nX[i]*lx + nY[i]*ly + nZ[i]*lz) - lz;          // lit minus flat
    v -= (0.5 - w.hs[i])*0.10;                                 // the floor sits in shade
    const o = i*4;
    if(v > 0){ d[o] = 255; d[o+1] = 252; d[o+2] = 244; d[o+3] = Math.min(255, v*330); }
    else     { d[o] = 52;  d[o+1] = 44;  d[o+2] = 34;  d[o+3] = Math.min(255, -v*300); }
  }
  w.ctx.putImageData(w.img, 0, 0);
}

// ── the sheet ─────────────────────────────────────────────────
function buildPaper(){
  // fibre is low frequency, so it is grown at a third of the size and scaled
  const q = 3, w = Math.ceil(PW/q), h = Math.ceil(PH/q);
  const F = Relief.field(w, h);
  const small = Relief.makeCanvas(w, h);
  F.paper(small.getContext('2d'), SHEET, {seed: SEED, vignette: 0.10, amount: 9});
  paperCv = Relief.makeCanvas(PW, PH);
  const c = paperCv.getContext('2d');
  c.imageSmoothingQuality = 'high';
  c.drawImage(small, 0, 0, PW, PH);
  grainPat = c.createPattern(Relief.grainTile(256, SEED, 26), 'repeat');
  poolCv = Relief.makeCanvas(Math.ceil(DW/12) + 1, Math.ceil(DH/12) + 1);
  poolCtx = poolCv.getContext('2d');
  bgCv = Relief.makeCanvas(PW, PH); bgCtx = bgCv.getContext('2d');
  canopyCv = makeCanopy();
}

// the lamp's pool on flat paper, with the same falloff the shader uses
const lampRGB = Relief.hexRgb(LAMP.color).map(v => v/255);
function shadePool(){
  const w = poolCv.width, h = poolCv.height;
  const img = poolCtx.createImageData(w, h), d = img.data;
  const R2 = 1/(LAMP.radius*LAMP.radius), lh2 = lamp.h*lamp.h;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const dx = lamp.x - x*12, dy = lamp.y - y*12, flat = dx*dx + dy*dy;
      const lz = lamp.h/Math.sqrt(flat + lh2);
      const diff = Math.pow(Math.max(0, (lz + LAMP.wrap)/(1 + LAMP.wrap)/(1 + flat*R2)), 0.72);
      const o = (y*w + x)*4;
      for(let c=0;c<3;c++) d[o+c] = Math.min(255, 255*(LAMP.amb + (1 - LAMP.amb)*diff*lampRGB[c]));
      d[o+3] = 255;
    }
  }
  poolCtx.putImageData(img, 0, 0);
}

// Shade from leaves somewhere above: clustered toward one corner, so the sun
// still falls clear on the rest of the sheet.
function makeCanopy(){
  const q = 6, w = Math.ceil(DW/q) + 40, h = Math.ceil(DH/q) + 40;
  const F = Relief.field(w, h);
  const rng = Relief.makeRng(SEED + 5);
  const corner = {x: w*0.98, y: -h*0.04};
  const reach = Math.hypot(w, h)*0.50;
  const m = F.raster(ctx => {
    for(let i=0;i<260;i++){
      const a = Math.PI*0.5 + rng()*Math.PI*0.5;      // fan down and to the left
      const r = Math.pow(rng(), 0.7)*reach;
      const x = corner.x + Math.cos(a)*r, y = corner.y + Math.sin(a)*r;
      const len = 7 + rng()*9, wid = len*(0.32 + rng()*0.18);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rng()*6.28);
      ctx.globalAlpha = 0.5 + rng()*0.5;
      ctx.beginPath(); ctx.ellipse(0, 0, len, wid, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });
  const b = F.blur(m, 2, 3);
  const cv = Relief.makeCanvas(w, h), ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  for(let i=0;i<w*h;i++){
    const v = Math.min(1, b[i]*1.25);
    img.data[i*4] = 74; img.data[i*4+1] = 80; img.data[i*4+2] = 66;
    img.data[i*4+3] = v*255;
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// ── lighting, all at once ─────────────────────────────────────
// The sheet and wordmark are cheap and relit every time. Slips are not, so
// while the lamp drifts they take turns — two a frame — and nobody can tell.
let turn = 0;
function relight(all){
  shadePool();
  shadeWordmark();
  if(all) slips.forEach(shadeSlip);
  else for(let k=0;k<2;k++) shadeSlip(slips[turn++ % slips.length]);
  bgCtx.globalCompositeOperation = 'source-over';
  bgCtx.drawImage(paperCv, 0, 0);
  bgCtx.globalCompositeOperation = 'multiply';
  bgCtx.imageSmoothingQuality = 'high';
  bgCtx.drawImage(poolCv, 0, 0, poolCv.width*12*SS, poolCv.height*12*SS);
  bgCtx.globalCompositeOperation = 'source-over';
  bgCtx.drawImage(wm.cv, Math.round(wm.cx*SS - wm.W/2), Math.round(wm.cy*SS - wm.H/2));
  lastLit = {x: lamp.x, y: lamp.y, h: lamp.h};
}

// ── p5 ────────────────────────────────────────────────────────
function measure(){
  DW = document.documentElement.clientWidth;
  DH = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  SS = Math.max(1, Math.min(dpr, Math.sqrt(PIXEL_BUDGET/(DW*DH))));
  PW = Math.round(DW*SS); PH = Math.round(DH*SS);
}

function restLamp(){
  return {x: DW*0.30, y: -DH*0.14, h: LAMP.h};
}

function build(){
  compose();
  buildPaper();
  slips.forEach(buildSlip);
  placeLinks();
}

function setup(){
  pixelDensity(1);
  measure();
  createCanvas(PW, PH).parent('stage');
  styleCanvas();
  noiseSeed(SEED);
  boot = () => {
    measure();
    // a window opened in the background can report no size yet
    if(DW < 2 || DH < 2){ waiting = true; return; }
    waiting = false;
    resizeCanvas(PW, PH); styleCanvas();
    build();
    const r = restLamp();
    lampT = Object.assign({}, r);
    // arrival: the sun comes up from low on the left and rakes the deboss in
    lamp = REDUCED ? Object.assign({}, r) : {x: -DW*0.25, y: DH*0.55, h: 120};
    slips.forEach((s, i) => { s.lift = REDUCED ? 1.5 : 70; s.delay = REDUCED ? 0 : 500 + i*170; });
    relight(true);
    ready = true;
    t0 = millis();
  };
  const fonts = document.fonts;
  if(fonts && fonts.load){
    const mapReady = new Promise(res => { if(MAP.complete) res(); else { MAP.addEventListener('load', res); MAP.addEventListener('error', res); } });
    // never leave the sheet blank: if a font or the map is slow, go without
    const late = new Promise(res => setTimeout(res, 2500));
    let booted = false;
    const once = () => { if(!booted){ booted = true; boot(); } };
    Promise.race([Promise.all([fonts.load('400 40px Lora'), fonts.load('500 20px Lora'),
                               fonts.load('italic 13px Lora'), mapReady]).then(() => fonts.ready), late])
      .then(once, once);
  } else boot();
}

function styleCanvas(){
  const c = document.querySelector('#stage canvas');
  c.style.width = DW + 'px'; c.style.height = DH + 'px';
}

let resizeTimer = 0;
function windowResized(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if(waiting && boot){ boot(); return; }
    measure(); resizeCanvas(PW, PH); styleCanvas();
    if(!ready) return;
    build();
    const r = restLamp(); lampT = Object.assign({}, r);
    if(REDUCED) lamp = Object.assign({}, r);
    relight(true);
  }, 160);
}

function draw(){
  if(!ready) return;
  const now = millis(), t = (now - t0)/1000;

  // the lamp leans a little toward the cursor, slowly
  const r = restLamp();
  lampT.x = r.x + (pointer ? (pointer.x - DW*0.5)*0.22 : 0);
  lampT.y = r.y + (pointer ? (pointer.y - DH*0.5)*0.14 : 0);
  const ease = t < 3.2 ? 0.035 : 0.045;
  if(!REDUCED){
    lamp.x += (lampT.x - lamp.x)*ease;
    lamp.y += (lampT.y - lamp.y)*ease;
    lamp.h += (lampT.h - lamp.h)*ease*0.8;
  }
  const drift = lastLit ? Math.hypot(lamp.x - lastLit.x, lamp.y - lastLit.y, (lamp.h - lastLit.h)*2) : 0;
  if(drift > 1.2){ relight(false); settled = false; }
  else if(!settled){ relight(true); settled = true; }   // one full pass once it stops

  carry();

  // lift: settled, stirred, held, picked up, carried
  slips.forEach(s => {
    let target = 1.5;
    if(s.el.classList.contains('near')) target = 4;
    if(s.hover || s.focus) target = 9;
    if(held && held.s === s) target = held.moved ? 24 : 15;
    if(now - t0 < s.delay) target = s.lift;           // not set down yet
    s.lift += (target - s.lift)*(REDUCED ? 1 : (target > s.lift ? 0.16 : 0.085));
  });

  const g = drawingContext;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(bgCv, 0, 0);

  slips.forEach(s => drawSlip(g, s, now));

  // the canopy, swaying a little; a second, fainter copy for depth
  const sway = REDUCED ? 0 : Math.sin(t*0.37)*5 + Math.sin(t*0.83 + 1.3)*2.5;
  const swy  = REDUCED ? 0 : Math.cos(t*0.29)*3;
  g.save();
  g.globalCompositeOperation = 'multiply';
  g.globalAlpha = 0.075;
  const cw = canopyCv.width*6*SS, ch = canopyCv.height*6*SS;
  g.drawImage(canopyCv, (-120 + sway)*SS, (-120 + swy)*SS, cw, ch);
  g.globalAlpha = 0.045;
  g.drawImage(canopyCv, (-138 - sway*1.6)*SS, (-110 + swy*1.4)*SS, cw, ch);
  g.restore();

  g.save();
  g.globalCompositeOperation = 'overlay';
  g.globalAlpha = 0.22;
  g.fillStyle = grainPat; g.fillRect(0, 0, PW, PH);
  g.restore();
}

function drawSlip(g, s, now){
  const appear = Math.min(1, Math.max(0, (now - t0 - s.delay)/260));
  if(appear <= 0) return;
  const lift = s.lift;
  // the shadow falls away from the lamp, further the higher the slip is held
  const dx = s.x - lamp.x, dy = s.y - lamp.y, dl = Math.hypot(dx, dy, lamp.h) || 1;
  const sx = dx/dl, sy = dy/dl;
  const k = 0.9 + 0.012*lift;                     // nearer the eye, a touch larger

  g.save();
  g.globalAlpha = appear*Math.max(0, 1 - lift/10);
  g.translate((s.x + sx*1.2)*SS, (s.y + sy*1.2 + 0.6)*SS);
  g.rotate(s.rot);
  g.drawImage(s.shContact, -s.W/2, -s.H/2);
  g.restore();

  g.save();
  g.globalAlpha = appear*Math.min(1, 0.35 + lift/9)*0.9;
  g.translate((s.x + sx*lift*1.6)*SS, (s.y + sy*lift*1.6 + lift*0.5)*SS);
  g.rotate(s.rot);
  g.scale(k*0.92 + 0.08, k*0.92 + 0.08);
  g.drawImage(s.shSoft, -s.W/2, -s.H/2);
  g.restore();

  g.save();
  g.globalAlpha = appear;
  const up = 1 + lift*0.0035;
  g.translate((s.x - sx*lift*0.25)*SS, (s.y - sy*lift*0.25 - lift*0.18)*SS);
  g.rotate(s.rot);
  g.scale(up, up);
  g.drawImage(s.cv, -s.W/2, -s.H/2);
  g.restore();
}

// ── the hand-holds ────────────────────────────────────────────
function placeLink(s){
  const a = s.el;
  a.style.width = s.hw*2 + 'px'; a.style.height = s.hh*2 + 'px';
  a.style.transform = 'translate(' + (s.x - s.hw) + 'px,' + (s.y - s.hh) + 'px) rotate(' + s.rot + 'rad)';
}
function placeLinks(){
  slips.forEach((s, z) => { placeLink(s); s.el.style.zIndex = z + 1; });
}

// ── picking a slip up ─────────────────────────────────────────
// Held by any point, a slip is dragged across the sheet by that point, so its
// middle swings round to trail the hand — the way paper on a table does. Let
// go while moving and it slides on a little before friction takes it. A tap
// that never moved is still just a tap, and opens the study.
const SLOP = 6;
function pickUp(s, e){
  const dx = e.clientX - s.x, dy = e.clientY - s.y;
  const c = Math.cos(-s.rot), n = Math.sin(-s.rot);
  held = {s, id: e.pointerId, lx: dx*c - dy*n, ly: dx*n + dy*c,
          x0: e.clientX, y0: e.clientY, px: e.clientX, py: e.clientY, qx: e.clientX, qy: e.clientY,
          vx: 0, vy: 0, w: 0, moved: false};
  s.glide = null; s.justMoved = false;
  slips.splice(slips.indexOf(s), 1); slips.push(s);   // whatever you pick up comes to the top
  placeLinks();
}
// only the slip on top of the pile can be named; the rest are under it
function markPile(){
  const pile = slips.filter(s => s.piled);
  slips.forEach(s => { s.el.classList.toggle('piled', !!s.piled); s.el.classList.remove('top'); });
}

function setDown(){
  const h = held; held = null;
  document.body.classList.remove('holding');
  if(!h || !h.moved) return;
  const s = h.s;
  s.placed = true; s.fx = s.x/DW; s.fy = s.y/DH;
  s.piled = false; markPile();                                    // taken off the pile, it is its own clipping now
  if(!REDUCED) s.glide = {vx: h.vx, vy: h.vy, w: h.w};
  s.justMoved = true;
}

function carry(){
  let moved = null;
  if(held && held.moved){
    const h = held, s = h.s;
    h.vx = h.px - h.qx; h.vy = h.py - h.qy; h.qx = h.px; h.qy = h.py;
    // drag acts at the middle, the hand at the grip: the sheet turns to trail
    const c = Math.cos(s.rot), n = Math.sin(s.rot);
    const rx = -(h.lx*c - h.ly*n), ry = -(h.lx*n + h.ly*c);
    const r2 = rx*rx + ry*ry;
    if(!REDUCED) h.w += -(rx*h.vy - ry*h.vx)/(r2 + s.U*s.U*0.6)*0.10;
    h.w = Math.max(-0.06, Math.min(0.06, h.w*0.80));
    s.rot += h.w;
    const c2 = Math.cos(s.rot), n2 = Math.sin(s.rot);
    s.x = h.px - (h.lx*c2 - h.ly*n2);
    s.y = h.py - (h.lx*n2 + h.ly*c2);
    moved = s;
  }
  slips.forEach(s => {
    if(!s.glide) return;
    const g = s.glide;
    s.x += g.vx; s.y += g.vy; s.rot += g.w;
    g.vx *= 0.86; g.vy *= 0.86; g.w *= 0.84;
    // the sheet's edge is as far as it goes
    s.x = Math.max(s.U*0.4, Math.min(DW - s.U*0.4, s.x));
    s.y = Math.max(s.U*0.4, Math.min(DH - s.U*0.4, s.y));
    s.fx = s.x/DW; s.fy = s.y/DH;
    if(Math.abs(g.vx) + Math.abs(g.vy) < 0.05 && Math.abs(g.w) < 0.0004) s.glide = null;
    placeLink(s); shadeSlip(s);
  });
  if(moved){ placeLink(moved); shadeSlip(moved); nearness(); }
}

function nearness(){
  slips.forEach(s => {
    let near = false;
    if(pointer){
      const dx = pointer.x - s.x, dy = pointer.y - s.y;
      const c = Math.cos(-s.rot), n = Math.sin(-s.rot);
      const lx = Math.abs(dx*c - dy*n) - s.hw, ly = Math.abs(dx*n + dy*c) - s.hh;
      near = Math.hypot(Math.max(0, lx), Math.max(0, ly)) < (s.piled ? 0 : 70);
    }
    s.el.classList.toggle('near', near);
  });
}

document.querySelectorAll('#slips a').forEach(a => {
  const slip = () => slips.find(s => s.el === a);
  a.setAttribute('draggable', 'false');
  a.addEventListener('dragstart', e => e.preventDefault());
  a.addEventListener('pointerenter', () => { const s = slip(); if(s) s.hover = true; });
  a.addEventListener('pointerleave', () => { const s = slip(); if(s && !(held && held.s === s)) s.hover = false; });
  a.addEventListener('pointerdown', e => {
    if(e.button !== 0 || held) return;
    const s = slip(); if(!s) return;
    a.setPointerCapture(e.pointerId);
    pickUp(s, e);
  });
  a.addEventListener('pointermove', e => {
    if(!held || e.pointerId !== held.id) return;
    held.px = e.clientX; held.py = e.clientY;
    if(!held.moved && Math.hypot(e.clientX - held.x0, e.clientY - held.y0) > SLOP){
      held.moved = true; held.qx = e.clientX; held.qy = e.clientY;
      document.body.classList.add('holding');
    }
  });
  const end = e => { if(held && e.pointerId === held.id) setDown(); };
  a.addEventListener('pointerup', end);
  a.addEventListener('pointercancel', end);
  // a slip that was carried was not chosen; only a still tap opens the study
  a.addEventListener('click', e => {
    const s = slip();
    if(s && s.justMoved){ e.preventDefault(); s.justMoved = false; }
  });
  a.addEventListener('focus', () => { const s = slip(); if(s) s.focus = true; });
  a.addEventListener('blur',  () => { const s = slip(); if(s) s.focus = false; });
});
window.addEventListener('pointermove', e => {
  if(e.pointerType === 'touch') return;
  pointer = {x: e.clientX, y: e.clientY};
  nearness();
});
document.documentElement.addEventListener('pointerleave', () => { pointer = null; nearness(); });
// coming back through history should find the slips at rest, not held
window.addEventListener('pageshow', () => { held = null; document.body.classList.remove('holding');
  slips.forEach(s => { s.hover = false; s.justMoved = false; }); });
</script>
</body>
